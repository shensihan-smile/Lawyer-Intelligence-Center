  FileTextOutlined,CalendarOutlined,DollarOutlined,SettingOutlined,UserOutlined,
  LogoutOutlined,MenuFoldOutlined,MenuUnfoldOutlined,LockOutlined,

// ===== 数据层 =====
const SK='lawyer_';
const DB={
  g(k){try{return JSON.parse(localStorage.getItem(SK+k)||'[]')}catch{return[]}},
  s(k,d){localStorage.setItem(SK+k,JSON.stringify(d))},
  nid(k){const d=this.g(k);return d.length?Math.max(...d.map(x=>x.id))+1:1},
  add(k,it){const d=this.g(k);it.id=this.nid(k);it.created_at=dayjs().format('YYYY-MM-DD HH:mm:ss');d.push(it);this.s(k,d);return it},
  upd(k,id,up){const d=this.g(k);const i=d.findIndex(x=>x.id===id);if(i<0)return null;d[i]={...d[i],...up,updated_at:dayjs().format('YYYY-MM-DD HH:mm:ss')};this.s(k,d);return d[i]},
  del(k,id){this.s(k,this.g(k).filter(x=>x.id!==id))},
};

// 初始化
(function(){
  if(DB.g('users').length===0){
    DB.add('users',{username:'admin',password:'admin123',real_name:'管理员',role:'admin',phone:'',email:'',is_active:true});
    DB.add('users',{username:'demo',password:'demo123',real_name:'体验用户',role:'lawyer',phone:'',email:'',is_active:true});
  }
  if(DB.g('billing_config').length===0){
    DB.add('billing_config',{name:'默认小时费率',billing_method:'hourly',unit_price:2000,is_default:true,notes:''});

})();

// ===== 常量 =====
const RL={admin:'管理员',lawyer:'律师',assistant:'助理'};
const RC={admin:'red',lawyer:'blue',assistant:'green'};
const SL={intake:'接案',filing:'立案',trial:'审理中',judgment:'判决',enforcement:'执行',closed:'结案'};
const SC={intake:'purple',filing:'geekblue',trial:'blue',judgment:'orange',enforcement:'volcano',closed:'green'};
const WL={legal_research:'法律研究',drafting:'文书起草',hearing:'庭审出庭',consultation:'客户咨询',other:'其他'};
const ML={hourly:'按小时',fixed:'按件',percentage:'按比例'};
const BSL={draft:'草稿',generated:'已生成',exported:'已导出',paid:'已收款'};
const BSC={draft:'default',generated:'blue',exported:'orange',paid:'green'};
const SCHL={hearing:'开庭',meeting:'会议',consultation:'咨询',deadline:'截止日期',other:'其他'};
const TC={hearing:'red',meeting:'blue',consultation:'green',deadline:'orange',other:'default'};
const DCL={legal_opinion:'法律意见书',contract_draft:'合同草案',complaint:'起诉状',defense:'答辩状',proxy_statement:'代理词',evidence_list:'证据清单',other:'其他'};
function fmtDur(m){if(!m||m<=0)return'0分钟';if(m<60)return m+'分钟';const h=Math.floor(m/60),r=m%60;return r>0?h+'小时'+r+'分钟':h+'小时'}
function fmtMoney(v){return v>0?v.toLocaleString()+'元':'-'}

// ===== Auth Context =====
const AuthCtx=createContext(null);

// ===== 登录页 =====
function LoginPage(){
  const[loading,setLoading]=useState(false);
  const[form]=Form.useForm();
  const{login}=useContext(AuthCtx);
  const doLogin=(u,p)=>{
    setLoading(true);
    const users=DB.g('users');
    const user=users.find(x=>x.username===u&&x.password===p);
    if(!user){message.error('用户名或密码错误');setLoading(false);return}
    if(!user.is_active){message.error('账号已停用');setLoading(false);return}
    login(user);message.success('欢迎，'+user.real_name);
    setLoading(false);
  };
  return <div className="login-bg">
    <div className="login-card">
      <div style={{textAlign:'center',marginBottom:24}}>
        <Title level={2} style={{color:'#1a1a2e',marginBottom:4}}>⚖ 律师智能中心</Title>
        <Text type="secondary">智能化律师工作平台</Text>
      </div>
      <Button type="primary" icon={<ExperimentOutlined/>} loading={loading} block size="large"
        onClick={()=>{form.setFieldsValue({username:'demo',password:'demo123'});doLogin('demo','demo123')}}
        style={{height:48,background:'linear-gradient(135deg,#52c41a,#73d13d)',border:'none',fontSize:16,fontWeight:600,marginBottom:16}}>
        一键体验（免输账号）
      </Button>
      <Divider plain><Text type="secondary" style={{fontSize:12}}>或使用账号密码登录</Text></Divider>
      <Form form={form} onFinish={v=>doLogin(v.username,v.password)} size="large">
        <Form.Item name="username" rules={[{required:true,message:'请输入用户名'}]}>
          <Input prefix={<UserOutlined/>} placeholder="用户名"/>
        </Form.Item>
        <Form.Item name="password" rules={[{required:true,message:'请输入密码'}]}>
          <Input.Password prefix={<LockOutlined/>} placeholder="密码"/>
        </Form.Item>
        <Button type="primary" htmlType="submit" loading={loading} block style={{background:'#1a1a2e',borderColor:'#1a1a2e'}}>登 录</Button>
      </Form>
      <div style={{marginTop:20,padding:'12px 16px',background:'#f6f8fa',borderRadius:6}}>
        <Text type="secondary" style={{fontSize:12}}>📋 demo / demo123 — 体验 &nbsp;|&nbsp; admin / admin123 — 管理员</Text>
      </div>
    </div>
  </div>;
}

// ===== 主导航 =====
const MENU_ITEMS=[
  {key:'dashboard',icon:<DashboardOutlined/>},{key:'communication',icon:<MessageOutlined/>},
  {key:'cases',icon:<FolderOpenOutlined/>},{key:'documents',icon:<FileTextOutlined/>},
  {key:'schedule',icon:<CalendarOutlined/>},{key:'billing',icon:<DollarOutlined/>},
  {key:'system',icon:<SettingOutlined/>},
];
const MENU_LABELS={dashboard:'工作台',communication:'智能通信',cases:'案件与文档',documents:'文档处理',schedule:'日程与庭审',billing:'财务管理',system:'系统管理'};

function MainLayout({children,page,onNav}){
  const[collapsed,setCollapsed]=useState(false);
  const{user,logout}=useContext(AuthCtx);
  const um={
    items:[
      {key:'p',icon:<UserOutlined/>,label:user?.real_name+' ('+(RL[user?.role]||'')+')',disabled:true},
      {key:'out',icon:<LogoutOutlined/>,label:'退出登录',danger:true},
    ],
    onClick:info=>{if(info.key==='out')logout()},
  };
  return <Layout style={{minHeight:'100vh'}}>
    <Sider trigger={null} collapsible collapsed={collapsed} width={200} style={{background:'#001529'}}>
      <div className={'logo'+(collapsed?' collapsed':'')} style={{borderBottom:'1px solid #002140'}}>
        {collapsed?'⚖':'⚖ 律师智能中心'}
      </div>
      <Menu theme="dark" mode="inline" selectedKeys={[page]} style={{background:'transparent',borderRight:'none'}}
        onClick={({key})=>onNav(key)}>
        {MENU_ITEMS.map(m=>(
          <Menu.Item key={m.key} icon={m.icon}>{MENU_LABELS[m.key]}</Menu.Item>
        ))}
      </Menu>
    </Sider>
    <Layout>
      <Header style={{padding:'0 24px',background:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between',height:56,borderBottom:'1px solid #f0f0f0'}}>
        <Button type="text" icon={collapsed?<MenuUnfoldOutlined/>:<MenuFoldOutlined/>} onClick={()=>setCollapsed(!collapsed)}/>
        <Dropdown menu={um}><div style={{cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
          <Avatar icon={<UserOutlined/>} style={{background:user?.role==='admin'?'#1890ff':'#52c41a'}}/>
          <span>{user?.real_name||''}</span></div></Dropdown>
      </Header>
      <Content style={{margin:0,padding:24,background:'#f0f2f5',minHeight:280,overflow:'auto'}}>{children}</Content>
    </Layout>
  </Layout>;
}

// ===== 工作台 =====
function DashboardPage(){
  const[stats,setStats]=useState({cases:0,hearings:0,docs:0,bills:0});
  const[recent,setRecent]=useState({cases:[],hearings:[]});
  useEffect(()=>{
    const cs=DB.g('cases'),ss=DB.g('schedules'),ds=DB.g('documents'),bs=DB.g('bills');
    const now=dayjs();
    setStats({
      cases:cs.filter(c=>c.case_stage!=='closed').length,
      hearings:ss.filter(s=>s.schedule_type==='hearing'&&dayjs(s.start_time).isAfter(now)).length,
      docs:ds.length,bills:bs.filter(b=>dayjs(b.generated_at).format('YYYY-MM')===now.format('YYYY-MM')).length,
    });
    setRecent({
      cases:cs.filter(c=>c.case_stage!=='closed').sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||'')).slice(0,5),
      hearings:ss.filter(s=>s.schedule_type==='hearing').sort((a,b)=>a.start_time.localeCompare(b.start_time)).slice(0,5),
    });
  },[]);
  return <div>
    <Title level={4} style={{marginBottom:24}}>工作台</Title>
    <Row gutter={[16,16]} style={{marginBottom:24}}>
      {[{t:'在办案件',v:stats.cases,ic:<FolderOpenOutlined/>,c:'#1890ff'},
        {t:'近期开庭',v:stats.hearings,ic:<CalendarOutlined/>,c:'#52c41a'},
        {t:'文档总数',v:stats.docs,ic:<FileTextOutlined/>,c:'#faad14'},
        {t:'本月账单',v:stats.bills,ic:<DollarOutlined/>,c:'#f5222d'}].map(s=>(
        <Col xs={24} sm={12} lg={6} key={s.t}>
          <Card hoverable className="stat-card"><Statistic title={s.t} value={s.v} prefix={s.ic} valueStyle={{color:s.c}}/></Card>
        </Col>
      ))}
    </Row>
    <Row gutter={[16,16]}>
      <Col xs={24} lg={12}><Card title="📅 近期开庭" style={{minHeight:280}}>
        {recent.hearings.length===0?<Empty description="暂无" image={Empty.PRESENTED_IMAGE_SIMPLE}/>:
          <List dataSource={recent.hearings} renderItem={s=>(
            <List.Item><List.Item.Meta title={<Text strong>{s.title}</Text>}
              description={<span><ClockCircleOutlined/> {dayjs(s.start_time).format('MM-DD HH:mm')} {s.location&&<span>&nbsp;|&nbsp;<EnvironmentOutlined/> {s.location}</span>}</span>}/></List.Item>)}/>}
      </Card></Col>
      <Col xs={24} lg={12}><Card title="📂 在办案件" style={{minHeight:280}}>
        {recent.cases.length===0?<Empty description="暂无" image={Empty.PRESENTED_IMAGE_SIMPLE}/>:
          <List dataSource={recent.cases} renderItem={c=>(
            <List.Item><List.Item.Meta title={<Text strong>{c.case_number}</Text>} description={c.case_reason||'未填写'}/>
              <Tag color={SC[c.case_stage]}>{SL[c.case_stage]}</Tag></List.Item>)}/>}
      </Card></Col>
    </Row>
  </div>;
}

// ===== 客户管理 =====
function CommunicationPage(){
  const[clients,setClients]=useState([]);const[search,setSearch]=useState('');
  const[mo,setMo]=useState(false);const[ed,setEd]=useState(null);const[form]=Form.useForm();
  const{user}=useContext(AuthCtx);
  const load=useCallback(()=>{
    let d=DB.g('clients');if(user?.role!=='admin')d=d.filter(c=>c.created_by===user?.username);
    if(search)d=d.filter(c=>(c.name||'').includes(search)||(c.contact_person||'').includes(search)||(c.phone||'').includes(search));
    setClients(d);
  },[search,user]);
  useEffect(()=>{load()},[load]);
  const col=[{title:'名称',dataIndex:'name',width:180},{title:'联系人',dataIndex:'contact_person',width:100},{title:'电话',dataIndex:'phone',width:130},{title:'微信',dataIndex:'wechat',width:120},{title:'地址',dataIndex:'address',ellipsis:true},
    {title:'操作',key:'a',width:120,render:(_,r)=><Space size="small">
      <Button type="link" size="small" icon={<EditOutlined/>} onClick={()=>{setEd(r);form.setFieldsValue(r);setMo(true)}}>编辑</Button>
      <Popconfirm title="确定删除?" onConfirm={()=>{DB.del('clients',r.id);load();message.success('已删除')}}>
        <Button type="link" size="small" danger icon={<DeleteOutlined/>}>删除</Button></Popconfirm></Space>}];
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
      <Title level={4} style={{margin:0}}>客户管理</Title>
      <Space><Input placeholder="搜索..." prefix={<SearchOutlined/>} allowClear value={search} onChange={e=>setSearch(e.target.value)} style={{width:200}}/>
        <Button icon={<ReloadOutlined/>} onClick={load}>刷新</Button>
        <Button type="primary" icon={<PlusOutlined/>} onClick={()=>{setEd(null);form.resetFields();setMo(true)}}>新建客户</Button></Space></div>
    <Card><Table columns={col} dataSource={clients} rowKey="id" pagination={{pageSize:20}} size="middle"/></Card>
    <Modal title={ed?'编辑客户':'新建客户'} visible={mo} onCancel={()=>setMo(false)} onOk={async()=>{
      const v=await form.validateFields();if(ed)DB.upd('clients',ed.id,v);else DB.add('clients',{...v,created_by:user?.username});
      message.success(ed?'已更新':'已创建');setMo(false);load();}} width={560}>
      <Form form={form} layout="vertical"><Form.Item name="name" label="名称" rules={[{required:true}]}><Input/></Form.Item>
        <Space style={{display:'flex'}}><Form.Item name="contact_person" label="联系人"><Input style={{width:200}}/></Form.Item>
          <Form.Item name="phone" label="电话"><Input style={{width:200}}/></Form.Item></Space>
        <Space style={{display:'flex'}}><Form.Item name="wechat" label="微信"><Input style={{width:200}}/></Form.Item>
          <Form.Item name="email" label="邮箱"><Input style={{width:200}}/></Form.Item></Space>
        <Form.Item name="address" label="地址"><Input/></Form.Item>
        <Form.Item name="notes" label="备注"><TextArea rows={2}/></Form.Item></Form></Modal></div>;
}

// ===== 案件管理 =====
function CasesPage(){
  const[cases,setCases]=useState([]);const[search,setSearch]=useState('');const[sf,setSf]=useState('');
  const[mo,setMo]=useState(false);const[ed,setEd]=useState(null);const[form]=Form.useForm();
  const[docs,setDocs]=useState([]);const{user}=useContext(AuthCtx);
  const load=useCallback(()=>{
    let d=DB.g('cases');if(user?.role!=='admin')d=d.filter(c=>c.created_by===user?.username);
    if(search)d=d.filter(c=>(c.case_number||'').includes(search)||(c.case_reason||'').includes(search));
    if(sf)d=d.filter(c=>c.case_stage===sf);setCases(d);
  },[search,sf,user]);
  useEffect(()=>{load();setDocs(DB.g('documents'))},[load]);
  const clients=DB.g('clients');
  const col=[{title:'案号',dataIndex:'case_number',width:160,render:v=><a style={{fontWeight:500}}>{v}</a>},{title:'案由',dataIndex:'case_reason',width:140,ellipsis:true},
    {title:'阶段',dataIndex:'case_stage',width:90,render:v=><Tag color={SC[v]}>{SL[v]}</Tag>},{title:'法院',dataIndex:'court',width:150,ellipsis:true},
    {title:'标的额',dataIndex:'amount_in_dispute',width:100,align:'right',render:v=>fmtMoney(v)},
    {title:'操作',key:'a',width:120,render:(_,r)=><Space size="small">
      <Button type="link" size="small" icon={<EditOutlined/>} onClick={()=>{
        setEd(r);const tags=[...(r.third_party_client_ids||[]).map(id=>'c:'+id),...(r.third_party||[])];
        form.setFieldsValue({...r,acceptance_date:r.acceptance_date?dayjs(r.acceptance_date):null,filing_date:r.filing_date?dayjs(r.filing_date):null,
          trial_date:r.trial_date?dayjs(r.trial_date):null,judgment_date:r.judgment_date?dayjs(r.judgment_date):null,
          closing_date:r.closing_date?dayjs(r.closing_date):null,third_party_tags:tags});setMo(true);}}>编辑</Button>
      <Popconfirm title="确定删除?" onConfirm={()=>{DB.del('cases',r.id);load();message.success('已删除')}}>
        <Button type="link" size="small" danger icon={<DeleteOutlined/>}>删除</Button></Popconfirm></Space>}];

  const stages=Object.entries(SL).map(([v,l])=>({value:v,label:l}));

  return <div>
    <Title level={4} style={{marginBottom:16}}>案件与文档中心</Title>
    <Card><Tabs defaultActiveKey="cases">
      <TabPane tab="案件管理" key="cases">
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
          <Title level={5} style={{margin:0}}>案件列表</Title>
          <Space><Input placeholder="搜索案号/案由..." prefix={<SearchOutlined/>} allowClear value={search} onChange={e=>setSearch(e.target.value)} style={{width:180}}/>
            <Select placeholder="阶段" allowClear value={sf||undefined} onChange={v=>setSf(v||'')} style={{width:110}} options={stages}/>
            <Button icon={<ReloadOutlined/>} onClick={load}>刷新</Button>
            <Button type="primary" icon={<PlusOutlined/>} onClick={()=>{setEd(null);form.resetFields();form.setFieldsValue({case_stage:'intake',amount_in_dispute:0,client_ids:[],third_party_tags:[]});setMo(true)}}>新建案件</Button></Space></div>
        <Table columns={col} dataSource={cases} rowKey="id" pagination={{pageSize:20}} size="middle" scroll={{x:1000}}/>
      </TabPane>
      <TabPane tab="文件归档" key="docs">
        <Card style={{marginBottom:16}}><Dragger multiple beforeUpload={f=>{
          const reader=new FileReader();reader.onload=e=>{
            DB.add('documents',{original_name:f.name,file_type:f.name.split('.').pop().toLowerCase(),file_size:f.size,
              size_display:f.size<1024?f.size+'B':f.size<1024*1024?(f.size/1024).toFixed(1)+'KB':(f.size/1024/1024).toFixed(2)+'MB',
              doc_category:'other',case_id:null,client_id:null,notes:'',version:1,author:user?.real_name||'',content:e.target.result});
            message.success(f.name+' 上传成功');setDocs(DB.g('documents'));};reader.readAsDataURL(f);return false;}} showUploadList={false} style={{padding:'16px 0'}}>
          <p className="ant-upload-drag-icon"><InboxOutlined style={{fontSize:40,color:'#1890ff'}}/></p>
          <p className="ant-upload-text">点击或拖拽文件上传</p><p className="ant-upload-hint">Base64 存储，仅适用于演示</p></Dragger></Card>
        <Table dataSource={docs} rowKey="id" pagination={{pageSize:20}} size="middle"
          columns={[{title:'文件名',dataIndex:'original_name',ellipsis:true},{title:'类型',dataIndex:'file_type',width:80},{title:'大小',dataIndex:'size_display',width:90},

          <Form.Item name="judge" label="法官"><Input style={{width:110}}/></Form.Item>

        <Space style={{display:'flex'}} wrap><Form.Item name="plaintiff" label="原告"><Input style={{width:240}}/></Form.Item>

        <Space style={{display:'flex'}}><Form.Item name="amount_in_dispute" label="标的额(元)"><InputNumber style={{width:160}}/></Form.Item></Space>
        <Form.Item name="third_party_tags" label="第三人" tooltip="输入搜索客户，搜不到按回车直接添加">
          <Select mode="tags" placeholder="输入搜索或直接添加..." style={{maxWidth:500}}
            options={clients.map(c=>({value:'c:'+c.id,label:c.name+(c.contact_person?' ('+c.contact_person+')':'')}))}

            tagRender={p=>{const icl=typeof p.value==='string'&&p.value.startsWith('c:');const cid=icl?parseInt(p.value.slice(2)):null;
              const cl=cid?clients.find(c=>c.id===cid):null;const lb=cl?cl.name+(cl.contact_person?' ('+cl.contact_person+')':''):String(p.value||p.label);
              return <Tag color={icl?'blue':'green'} closable={p.closable} onClose={p.onClose} style={{marginRight:3}}>{icl?'📋':'✏️'} {lb}</Tag>;}}/></Form.Item>
        <Space style={{display:'flex'}} wrap>

// ===== 日程管理 =====
function SchedulePage(){
  const[ss,setSs]=useState([]);const[view,setView]=useState('month');const[cd,setCd]=useState(dayjs());
  const[mo,setMo]=useState(false);const[ed,setEd]=useState(null);const[form]=Form.useForm();
  const[smsT,setSmsT]=useState('');const[smsR,setSmsR]=useState(null);
  const load=()=>setSs(DB.g('schedules'));useEffect(()=>{load()},[]);

  const getDaySch=d=>ss.filter(s=>dayjs(s.start_time).format('YYYY-MM-DD')===d.format('YYYY-MM-DD'));
  const getConflicts=()=>{const ids=new Set();for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++)
    if(dayjs(ss[i].start_time)<dayjs(ss[j].end_time)&&dayjs(ss[i].end_time)>dayjs(ss[j].start_time)){ids.add(ss[i].id);ids.add(ss[j].id)}return ids};
  const cids=getConflicts();

  const renderMonth=()=>{
    const fd=cd.startOf('month');let d=fd.subtract(fd.day(),'day');
    const weeks=[];
    for(let w=0;w<6;w++){const wk=[];for(let x=0;x<7;x++){wk.push(d);d=d.add(1,'day')}weeks.push(wk);if(w>=3&&d.isAfter(cd.endOf('month'),'day'))break}
    const today=dayjs().format('YYYY-MM-DD');
    return <div style={{borderRadius:8,overflow:'hidden'}}>
      <div style={{display:'flex',background:'#fafafa'}}>{['日','一','二','三','四','五','六'].map(w=><div key={w} style={{flex:1,textAlign:'center',padding:'8px 0',fontSize:13,fontWeight:600,color:'#666'}}>{w}</div>)}</div>
      {weeks.map((wk,wi)=><div key={wi} className="cal-row" style={{display:'flex'}}>
        {wk.map((dy,di)=>{const isCur=dy.month()===cd.month();const isTd=dy.format('YYYY-MM-DD')===today;const ds=getDaySch(dy);
          return <div key={di} className={`cal-cell${isTd?' today':''}${!isCur?' other':''}`}
            onClick={()=>{form.resetFields();setEd(null);form.setFieldsValue({schedule_type:'hearing',time_range:[dy.hour(9).minute(0),dy.hour(12).minute(0)]});setMo(true)}}>
            <div className={`cal-date${isTd?' today':''}`}>{dy.format('D')}</div>
            {ds.slice(0,3).map(s=><div key={s.id} className={`sdot ${cids.has(s.id)?'conflict':'normal'}`}
              onClick={e=>{e.stopPropagation();setEd(s);form.setFieldsValue({...s,time_range:[dayjs(s.start_time),dayjs(s.end_time)]});setMo(true)}}>{s.title}</div>)}
            {ds.length>3&&<div style={{fontSize:10,color:'#999'}}>+{ds.length-3}</div>}</div>})}</div>)}</div>;
  };

  const parseSms=()=>{if(!smsT.trim()){message.warning('请输入短信');return}const t=smsT.trim();const r={case_number:'',hearing_datetime:'',location:'',judge:'',phone:'',method:'regex'};
    const cm=t.match(/[\(（]?\s*(\d{4}[\)）]?\s*\S{3,30}号)/);if(cm)r.case_number=cm[1];
    const dm=t.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(?:上午|下午|晚上)?\s*(\d{1,2})[时:：](\d{1,2})/);
    if(dm){try{const dt=dayjs(dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0')+'T'+dm[4].padStart(2,'0')+':'+dm[5].padStart(2,'0')+':00');if(dt.isValid())r.hearing_datetime=dt.format('YYYY-MM-DDTHH:mm:ss')}catch(e){}}
    const lm=t.match(/((?:本院|法庭|法院|审判庭|第\d+法庭|第\d+审判庭)[^\s，。,.]*)/);if(lm)r.location=lm[1];
    const jm=t.match(/(?:承办法官|审判长|法官)[：:：]?\s*([^\s，。,，。\d]{2,4})/);if(jm)r.judge=jm[1];
    const pm=t.match(/(?:联系电话|电话|联系方式)[：:：]?\s*(\d{7,15})/);if(pm)r.phone=pm[1];
    if(!r.case_number&&!r.hearing_datetime){message.warning('未能识别');return}setSmsR(r);message.success('解析完成');};
  const cases=DB.g('cases');

  return <div>
    <Title level={4} style={{marginBottom:16}}>日程与庭审中心</Title>
    <Card><Tabs defaultActiveKey="calendar">
      <TabPane tab="日历视图" key="calendar">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <Space><Title level={5} style={{margin:0}}>日历</Title>
            <Radio.Group value={view} onChange={e=>setView(e.target.value)} size="small" optionType="button">
              <Radio.Button value="month">月</Radio.Button><Radio.Button value="week">周</Radio.Button></Radio.Group>
            <Button onClick={()=>setCd(dayjs())}>今天</Button>
            <Button onClick={()=>setCd(cd.subtract(1,view==='month'?'month':'week'))}>{'<'}</Button>
            <Button onClick={()=>setCd(cd.add(1,view==='month'?'month':'week'))}>{'>'}</Button>
            <Text type="secondary">{cd.format('YYYY年M月')}</Text></Space>
          <Button type="primary" icon={<PlusOutlined/>} onClick={()=>{setEd(null);form.resetFields();
            form.setFieldsValue({schedule_type:'hearing',time_range:[dayjs().hour(9).minute(0),dayjs().hour(12).minute(0)]});setMo(true)}}>新建日程</Button></div>
        {cids.size>0&&<Alert type="error" message={`${ss.filter(s=>cids.has(s.id)).length}个日程存在时间冲突`} showIcon closable style={{marginBottom:16}}/>}
        {renderMonth()}
        <div style={{marginTop:16}}><Title level={5}>日程列表 ({ss.length})</Title>
          {ss.length===0?<Empty description="暂无"/>:ss.map(s=><Card key={s.id} size="small" hoverable style={{marginBottom:6}}
            onClick={()=>{setEd(s);form.setFieldsValue({...s,time_range:[dayjs(s.start_time),dayjs(s.end_time)]});setMo(true)}}>
            <div style={{display:'flex',justifyContent:'space-between'}}><Space><Tag color={TC[s.schedule_type]}>{SCHL[s.schedule_type]}</Tag>
              <Text strong style={{color:cids.has(s.id)?'#ff4d4f':'#333'}}>{s.title}</Text>{cids.has(s.id)&&<Tag color="error">冲突</Tag>}</Space>
            <Text type="secondary">{dayjs(s.start_time).format('MM-DD HH:mm')}~{dayjs(s.end_time).format('HH:mm')}{s.location?' | '+s.location:''}</Text></div></Card>)}</div>
      </TabPane>
      <TabPane tab="短信解析" key="sms">
        <Alert message="粘贴12368法院短信，自动提取开庭信息" type="info" showIcon style={{marginBottom:16}}/>
        <Card title="短信内容" style={{marginBottom:16}}>
          <TextArea rows={6} value={smsT} onChange={e=>{setSmsT(e.target.value);setSmsR(null)}}
            placeholder="【12368法院服务平台】XX人民法院通知：关于(2026)京0105民初12345号案件，定于2026年9月15日09时30分在本院第3审判庭开庭审理，承办法官张三。"/>
          <Button type="primary" icon={<ThunderboltOutlined/>} onClick={parseSms} style={{marginTop:12}}>解析短信</Button></Card>
        {smsR&&(smsR.case_number||smsR.hearing_datetime)&&<Card title="解析结果">
          <Descriptions column={2} size="small" bordered>
            <Descriptions.Item label="案号"><Text strong>{smsR.case_number||'未识别'}</Text></Descriptions.Item>
            <Descriptions.Item label="开庭时间"><Text strong>{smsR.hearing_datetime?dayjs(smsR.hearing_datetime).format('YYYY年M月D日 HH:mm'):'未识别'}</Text></Descriptions.Item>
            <Descriptions.Item label="地点">{smsR.location||'未识别'}</Descriptions.Item>
            <Descriptions.Item label="法官">{smsR.judge||'未识别'}</Descriptions.Item></Descriptions>
          <Divider/><Button type="primary" icon={<PlusOutlined/>} disabled={!smsR.hearing_datetime} onClick={()=>{
            DB.add('schedules',{title:'开庭-'+smsR.case_number,schedule_type:'hearing',start_time:smsR.hearing_datetime,
              end_time:dayjs(smsR.hearing_datetime).add(3,'hour').toISOString(),location:smsR.location||'',judge:smsR.judge||'',notes:'来源：12368短信',is_parsed_from_sms:true});
            message.success('已创建开庭日程');load();}}>一键创建开庭日程</Button></Card>}
      </TabPane></Tabs></Card>

    <Modal title={ed?'编辑日程':'新建日程'} visible={mo} onCancel={()=>setMo(false)} onOk={async()=>{
      const v=await form.validateFields();const p={...v,start_time:v.time_range[0].toISOString(),end_time:v.time_range[1].toISOString()};
      delete p.time_range;if(ed)DB.upd('schedules',ed.id,p);else DB.add('schedules',p);
      message.success(ed?'已更新':'已创建');setMo(false);load();}} width={520}>
      <Form form={form} layout="vertical"><Form.Item name="title" label="标题" rules={[{required:true}]}><Input/></Form.Item>
        <Space style={{display:'flex'}}><Form.Item name="schedule_type" label="类型"><Select style={{width:120}} options={Object.entries(SCHL).map(([v,l])=>({value:v,label:l}))}/></Form.Item>
          <Form.Item name="case_id" label="关联案件"><Select allowClear placeholder="可选" style={{width:200}} options={cases.map(c=>({value:c.id,label:c.case_number}))}/></Form.Item></Space>
        <Form.Item name="time_range" label="时间范围" rules={[{required:true}]}><RangePicker showTime={{format:'HH:mm'}} format="YYYY-MM-DD HH:mm" style={{width:'100%'}}/></Form.Item>
        <Space style={{display:'flex'}}><Form.Item name="location" label="地点"><Input style={{width:220}}/></Form.Item>
          <Form.Item name="judge" label="法官"><Input style={{width:140}}/></Form.Item></Space>
        <Form.Item name="notes" label="备注"><TextArea rows={2}/></Form.Item></Form></Modal></div>;
}

function BillingPage(){
  const[recs,setRecs]=useState([]);const[bills,setBills]=useState([]);const[cfgs,setCfgs]=useState([]);
  const[at,setAt]=useState(null);const[tmo,setTmo]=useState(false);const[tf]=Form.useForm();
  const[cmo,setCmo]=useState(false);const[ec,setEc]=useState(null);const[cf]=Form.useForm();
  const[gmo,setGmo]=useState(false);const[gf]=Form.useForm();const[sb,setSb]=useState(null);const tRef=useRef(null);

    tRef.current=setInterval(()=>setAt(p=>p?{...p,el:Math.floor((Date.now()-new Date(p.r.start_time).getTime())/60000)}:null),10000)}return()=>clearInterval(tRef.current)},[]);

  return <div>

    <Card><Tabs defaultActiveKey="time">
      <TabPane tab="工时记录" key="time">
        <Card style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <Space><Title level={5} style={{margin:0}}>⌛ 计时器</Title>
            {at?<Space><Tag color="processing">计时中</Tag><Text>已过 {fmtDur(at.el)}</Text></Space>:<Text type="secondary">点击开始</Text>}</Space>
          {at?<Button type="primary" danger icon={<PauseCircleOutlined/>} size="large" onClick={()=>{
            const m=Math.max(1,Math.floor((Date.now()-new Date(at.r.start_time).getTime())/60000));
            DB.upd('time_records',at.r.id,{end_time:new Date().toISOString(),duration_minutes:m});message.success('计时结束，'+fmtDur(m));setAt(null);load();}}>停止计时</Button>:
            <Space><Button type="primary" icon={<PlayCircleOutlined/>} size="large" onClick={()=>{tf.resetFields();setTmo(true)}}>开始计时</Button>
              <Button icon={<PlusOutlined/>} onClick={()=>{tf.resetFields();setTmo(true)}}>手动补录</Button></Space>}</div></Card>
        <Table dataSource={recs} rowKey="id" size="middle" pagination={{pageSize:20}}
          columns={[{title:'分类',dataIndex:'work_category',width:90,render:v=><Tag>{WL[v]}</Tag>},{title:'描述',dataIndex:'description',ellipsis:true},
            {title:'开始',dataIndex:'start_time',width:120,render:v=>v?dayjs(v).format('MM-DD HH:mm'):'-'},
            {title:'时长',dataIndex:'duration_minutes',width:90,render:v=>v>0?fmtDur(v):<Tag color="processing">计时中</Tag>},
            {title:'状态',dataIndex:'is_billed',width:70,render:v=>v?<Tag color="green">已计费</Tag>:<Tag>未计费</Tag>},
            {title:'操作',key:'a',width:80,render:(_,r)=><Popconfirm title="删除?" onConfirm={()=>{DB.del('time_records',r.id);load()}} disabled={r.is_billed}>
              <Button type="link" size="small" danger disabled={r.is_billed}>删除</Button></Popconfirm>}]}/></TabPane>

      <TabPane tab="计费配置" key="config">
        <Alert message="默认配置应用于所有案件，可在案件编辑中覆盖" type="info" showIcon style={{marginBottom:16}}/>
        <Button type="primary" icon={<PlusOutlined/>} style={{marginBottom:16}} onClick={()=>{setEc(null);cf.resetFields();cf.setFieldsValue({billing_method:'hourly',unit_price:2000,is_default:false});setCmo(true)}}>新增配置</Button>
        <Table dataSource={cfgs} rowKey="id" pagination={false} size="middle"
          columns={[{title:'名称',dataIndex:'name'},{title:'方式',dataIndex:'billing_method',width:80,render:v=><Tag>{ML[v]}</Tag>},
            {title:'费率',dataIndex:'unit_price',width:120,render:(v,r)=>r.billing_method==='percentage'?v+'%':r.billing_method==='fixed'?v.toLocaleString()+'元/件':v.toLocaleString()+'元/小时'},
            {title:'默认',dataIndex:'is_default',width:70,render:v=>v?<Tag color="green">默认</Tag>:''},
            {title:'操作',key:'a',width:120,render:(_,r)=><Space><Button type="link" size="small" onClick={()=>{setEc(r);cf.setFieldsValue(r);setCmo(true)}}>编辑</Button>
              <Button type="link" size="small" danger onClick={()=>{DB.del('billing_config',r.id);load()}}>删除</Button></Space>}]}/></TabPane>

      <TabPane tab="账单管理" key="bills">
        <div style={{marginBottom:16,display:'flex',gap:8}}><Alert message="从工时记录自动生成账单" type="info" showIcon style={{flex:1}}/>
          <Button type="primary" icon={<FileTextOutlined/>} size="large" onClick={()=>{gf.resetFields();setGmo(true)}}>生成账单</Button></div>
        <Table dataSource={bills} rowKey="id" size="middle" pagination={{pageSize:20}}
          columns={[{title:'编号',dataIndex:'bill_number',width:180,render:v=><a onClick={()=>{const b=bills.find(x=>x.bill_number===v);if(b)setSb(b)}}>{v}</a>},
            {title:'金额',dataIndex:'total_amount',width:120,align:'right',render:v=>v.toLocaleString()+'元'},
            {title:'状态',dataIndex:'status',width:80,render:v=><Tag color={BSC[v]}>{BSL[v]}</Tag>},
            {title:'生成时间',dataIndex:'generated_at',width:120,render:v=>v?dayjs(v).format('YYYY-MM-DD'):'-'},
            {title:'操作',key:'a',width:100,render:(_,r)=><Space>
              {r.status!=='paid'&&<Button type="link" size="small" onClick={()=>{DB.upd('bills',r.id,{status:'paid',exported_at:dayjs().format('YYYY-MM-DD HH:mm:ss')});load()}}>收款</Button>}
              <Button type="link" size="small" danger onClick={()=>{(r.items||[]).forEach(i=>(i.time_record_ids||[]).forEach(rid=>DB.upd('time_records',rid,{is_billed:false})));DB.del('bills',r.id);load()}}>删除</Button></Space>}]}/></TabPane></Tabs></Card>

    <Modal title={at?'开始计时':'添加工时记录'} visible={tmo} onCancel={()=>setTmo(false)} onOk={at?undefined:async()=>{
      const v=await tf.validateFields();const[s,e]=v.time_range;const m=Math.max(1,Math.floor((e.toDate()-s.toDate())/60000));
      DB.add('time_records',{case_id:v.case_id||null,work_category:v.work_category||'other',description:v.description||'',start_time:s.toISOString(),end_time:e.toISOString(),duration_minutes:m,is_billed:false});
      message.success('已添加');setTmo(false);load();}} footer={at?[<Button key="c" onClick={()=>setTmo(false)}>取消</Button>,<Button key="s" type="primary" icon={<PlayCircleOutlined/>} onClick={async()=>{
      const v=await tf.validateFields();const r=DB.add('time_records',{case_id:v.case_id||null,work_category:v.work_category||'other',description:v.description||'',start_time:new Date().toISOString(),end_time:new Date().toISOString(),duration_minutes:0,is_billed:false});
      setAt({r,el:0});setTmo(false);load();}}>开始计时</Button>]:undefined} width={520}>
      <Form form={tf} layout="vertical"><Form.Item name="case_id" label="关联案件"><Select allowClear options={cases.map(c=>({value:c.id,label:c.case_number}))}/></Form.Item>
        <Form.Item name="work_category" label="分类" initialValue="other"><Select style={{width:160}} options={Object.entries(WL).map(([v,l])=>({value:v,label:l}))}/></Form.Item>
        {!at&&<Form.Item name="time_range" label="时间范围" rules={[{required:true}]}><RangePicker showTime={{format:'HH:mm'}} format="YYYY-MM-DD HH:mm" style={{width:'100%'}}/></Form.Item>}
        <Form.Item name="description" label="描述"><TextArea rows={2}/></Form.Item></Form></Modal>

    <Modal title={ec?'编辑配置':'新增配置'} visible={cmo} onCancel={()=>setCmo(false)} onOk={async()=>{
      const v=await cf.validateFields();if(ec)DB.upd('billing_config',ec.id,v);else{if(v.is_default)DB.g('billing_config').forEach(c=>DB.upd('billing_config',c.id,{is_default:false}));DB.add('billing_config',v);}
      message.success(ec?'已更新':'已创建');setCmo(false);load();}} width={460}>
      <Form form={cf} layout="vertical"><Form.Item name="name" label="名称" rules={[{required:true}]}><Input/></Form.Item>
        <Form.Item name="billing_method" label="方式"><Radio.Group><Radio.Button value="hourly">按小时</Radio.Button><Radio.Button value="fixed">按件</Radio.Button><Radio.Button value="percentage">按比例</Radio.Button></Radio.Group></Form.Item>
        <Form.Item name="unit_price" label="费率" rules={[{required:true}]}><InputNumber min={0} step={100} style={{width:200}}/></Form.Item>
        <Form.Item name="is_default" label="默认" valuePropName="checked"><Select options={[{value:true,label:'是'},{value:false,label:'否'}]}/></Form.Item></Form></Modal>

    <Modal title="生成账单" visible={gmo} onCancel={()=>setGmo(false)} onOk={async()=>{
      const v=await gf.validateFields();const [ps,pe]=v.period;const cid=v.client_id;
      const caseIds=DB.g('cases').filter(c=>DB.g('clients').find(cl=>cl.id===cid)).map(c=>c.id);
      const ub=DB.g('time_records').filter(r=>!r.is_billed&&caseIds.includes(r.case_id)&&dayjs(r.start_time).isAfter(ps)&&dayjs(r.end_time).isBefore(pe));
      if(ub.length===0){message.error('该期间没有未计费工时');return}
      const cfg=DB.g('billing_config').find(c=>c.is_default)||{billing_method:'hourly',unit_price:2000};
      const groups={};ub.forEach(r=>{const k=r.case_id+'_'+r.work_category;if(!groups[k])groups[k]=[];groups[k].push(r)});
      const items=[];Object.values(groups).forEach(g=>{
        const totalMin=g.reduce((s,r)=>s+r.duration_minutes,0);const cs=DB.g('cases').find(c=>c.id===g[0].case_id);
        const amt=cfg.billing_method==='fixed'?cfg.unit_price:cfg.billing_method==='percentage'?(cs?.amount_in_dispute||0)*cfg.unit_price/100:Math.round(totalMin/60*cfg.unit_price*100)/100;
        items.push({case_id:g[0].case_id,description:WL[g[0].work_category],billing_method:cfg.billing_method,unit_price:cfg.unit_price,quantity:+(totalMin/60).toFixed(1),amount:amt,time_record_ids:g.map(r=>r.id)});});
      const bill=DB.add('bills',{bill_number:'BILL-'+dayjs().format('YYYYMMDD')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),client_id:cid,
        billing_period_start:ps.toISOString(),billing_period_end:pe.toISOString(),total_amount:items.reduce((s,i)=>s+i.amount,0),status:'generated',
        notes:v.notes||'',generated_at:dayjs().format('YYYY-MM-DD HH:mm:ss'),exported_at:null,items});
      items.forEach(it=>it.time_record_ids.forEach(rid=>DB.upd('time_records',rid,{is_billed:true})));
      message.success('账单 '+bill.bill_number+' 已生成');setGmo(false);load();}} width={560}>
      <Form form={gf} layout="vertical"><Form.Item name="client_id" label="客户" rules={[{required:true}]}><Select options={DB.g('clients').map(c=>({value:c.id,label:c.name}))}/></Form.Item>
        <Form.Item name="period" label="计费期间" rules={[{required:true}]}><RangePicker style={{width:'100%'}}/></Form.Item>
        <Divider>律所信息</Divider><Form.Item name="firm_name" label="律所"><Input/></Form.Item>
        <Form.Item name="lawyer_name" label="律师"><Input/></Form.Item><Form.Item name="notes" label="备注"><TextArea rows={2}/></Form.Item></Form></Modal>

    <Modal title={'账单详情 - '+(sb?.bill_number||'')} visible={!!sb} onCancel={()=>setSb(null)} width={700} footer={null}>
      {sb&&<><Descriptions column={3} size="small" bordered><Descriptions.Item label="金额"><Text strong>{sb.total_amount.toLocaleString()}元</Text></Descriptions.Item>
        <Descriptions.Item label="状态"><Tag color={BSC[sb.status]}>{BSL[sb.status]}</Tag></Descriptions.Item></Descriptions>
        <Divider>明细</Divider><Table dataSource={sb.items||[]} rowKey="id" pagination={false} size="small"
          columns={[{title:'描述',dataIndex:'description'},{title:'方式',dataIndex:'billing_method',width:70,render:v=>ML[v]},{title:'数量',dataIndex:'quantity',width:80,align:'right'},
            {title:'单价',dataIndex:'unit_price',width:100,align:'right',render:v=>v.toLocaleString()},{title:'金额',dataIndex:'amount',width:120,align:'right',render:v=><Text strong>{v.toLocaleString()}元</Text>}]}/>
        <div style={{textAlign:'right',marginTop:16}}><Text strong style={{fontSize:16}}>合计：¥ {sb.total_amount.toLocaleString()}</Text></div></>}</Modal></div>;
}

// ===== 系统管理 =====
function SystemPage(){
  const[users,setUsers]=useState([]);const[mo,setMo]=useState(false);const[eu,setEu]=useState(null);const[form]=Form.useForm();
  const{user:me}=useContext(AuthCtx);const isAdm=me?.role==='admin';
  const load=()=>setUsers(DB.g('users'));useEffect(()=>{load()},[]);
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
      <Title level={4} style={{margin:0}}><SettingOutlined/> 系统管理</Title>
      <Button type="primary" icon={<PlusOutlined/>} disabled={!isAdm} onClick={()=>{setEu(null);form.resetFields();form.setFieldsValue({role:'lawyer'});setMo(true)}}>添加成员</Button></div>
    <Alert message={'当前: '+me?.real_name+' ('+RL[me?.role]+')'+(isAdm?' — 管理员':'')} type={isAdm?'success':'info'} showIcon style={{marginBottom:16}}/>
    <Card title={'团队成员 ('+users.length+'人)'}>
      {!isAdm&&<Alert message="仅管理员可管理成员" type="warning" showIcon style={{marginBottom:16}}/>}
      <Table dataSource={users} rowKey="id" size="middle" pagination={false}
        columns={[{title:'用户名',dataIndex:'username',width:100},{title:'姓名',dataIndex:'real_name',width:90},{title:'角色',dataIndex:'role',width:80,render:v=><Tag color={RC[v]}>{RL[v]}</Tag>},
          {title:'电话',dataIndex:'phone',width:120,render:v=>v||'-'},{title:'状态',dataIndex:'is_active',width:70,
            render:(v,u)=>isAdm?<Switch checked={v} size="small" onChange={()=>{DB.upd('users',u.id,{is_active:!u.is_active});load();message.success(u.real_name+(u.is_active?' 已停用':' 已启用'))}}
              checkedChildren={<CheckCircleOutlined/>} unCheckedChildren={<StopOutlined/>}/>:<Tag color={v?'green':'red'}>{v?'正常':'已停用'}</Tag>},
          {title:'操作',key:'a',width:100,render:(_,u)=><Space>
            <Button type="link" size="small" icon={<EditOutlined/>} disabled={!isAdm} onClick={()=>{setEu(u);form.setFieldsValue({real_name:u.real_name,role:u.role,phone:u.phone||'',email:u.email||''});setMo(true)}}>编辑</Button>
            <Popconfirm title="确定删除?" onConfirm={()=>{DB.del('users',u.id);load();message.success('已删除')}}>
              <Button type="link" size="small" danger disabled={!isAdm||u.id===me?.id}>删除</Button></Popconfirm></Space>}]}/>
      <div style={{marginTop:16,background:'#fafafa',padding:16,borderRadius:8}}><Text strong>角色权限：</Text>
        <Descriptions column={3} size="small" style={{marginTop:8}}><Descriptions.Item label={<Tag color="red">管理员</Tag>}>全部数据+管成员</Descriptions.Item>
          <Descriptions.Item label={<Tag color="blue">律师</Tag>}>自己的数据</Descriptions.Item><Descriptions.Item label={<Tag color="green">助理</Tag>}>被分配的数据</Descriptions.Item></Descriptions></div></Card>
    <Modal title={eu?'编辑成员':'添加成员'} visible={mo} onCancel={()=>setMo(false)} onOk={async()=>{
      const v=await form.validateFields();const up={...v};if(!up.password)delete up.password;
      if(eu)DB.upd('users',eu.id,up);else DB.add('users',{...up,is_active:true});
      message.success(eu?'已更新':'已创建');setMo(false);load();}} width={460}>
      <Form form={form} layout="vertical">
        {!eu&&<><Form.Item name="username" label="用户名" rules={[{required:true}]}><Input/></Form.Item>
          <Form.Item name="password" label="密码" rules={[{required:true}]}><Input.Password/></Form.Item></>}
        <Form.Item name="real_name" label="姓名" rules={[{required:true}]}><Input/></Form.Item>
        <Form.Item name="role" label="角色" rules={[{required:true}]}><Select options={Object.entries(RL).map(([v,l])=>({value:v,label:l}))}/></Form.Item>
        <Space style={{display:'flex'}}><Form.Item name="phone" label="电话"><Input style={{width:180}}/></Form.Item>
          <Form.Item name="email" label="邮箱"><Input style={{width:200}}/></Form.Item></Space>
        {eu&&<Form.Item name="password" label="新密码(留空不变)"><Input.Password/></Form.Item>}</Form></Modal></div>;
}

// ===== App 根 =====
function App(){
  const[user,setUser]=useState(()=>{const s=localStorage.getItem('lawyer_user');return s?JSON.parse(s):null});
  const[page,setPage]=useState('dashboard');
  const login=u=>{const{p,...safe}=u;setUser(safe);localStorage.setItem('lawyer_user',JSON.stringify(safe));setPage('dashboard')};
  const logout=()=>{setUser(null);localStorage.removeItem('lawyer_user')};
  if(!user)return <LoginPage/>;
  const pages={dashboard:<DashboardPage/>,communication:<CommunicationPage/>,cases:<CasesPage/>,
    documents:<DocumentsPage/>,schedule:<SchedulePage/>,billing:<BillingPage/>,system:<SystemPage/>};
  return <AuthCtx.Provider value={{user,login,logout}}>
    <MainLayout page={page} onNav={setPage}>{pages[page]||<DashboardPage/>}</MainLayout></AuthCtx.Provider>;
}
render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
