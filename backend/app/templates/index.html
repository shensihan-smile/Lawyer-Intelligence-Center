function oppositeParty(c){var cn='';if(c.clients&&c.clients.length>0)cn=c.clients[0].name;if(cn&&c.plaintiff&&c.plaintiff.indexOf(cn)>-1)return c.defendant||'';return c.plaintiff||c.defendant||''}
var TPL_VARS={'{委托人}':function(c){return c.clients&&c.clients[0]?c.clients[0].name:''},'{对方当事人}':function(c){return oppositeParty(c)},'{受理法院}':function(c){return c.court||''},'{案由}':function(c){return c.case_reason||''},'{当前日期}':function(){return new Date().getFullYear()+'年'+(new Date().getMonth()+1)+'月'+new Date().getDate()+'日'}};
function fillTemplateVars(html,c){var r=html;for(var k in TPL_VARS){r=r.split(k).join(esc((TPL_VARS[k](c))||''))}return r}

// 提取HTML中所有 {xxx} 变量
function extractVars(html){var re=/\{[^\{\}]+\}/g;var m=html.match(re);if(!m)return[];var seen={},r=[];m.forEach(function(v){if(!seen[v]){seen[v]=true;r.push(v)}});return r}

  setTimeout(function(){var inp=$('tplNewCatName');if(inp)inp.focus()},100)
}

function saveNewCategory(){
  var name=($('tplNewCatName').value||'').trim();
  if(!name){toast('请输入分类名称','err');return}
  // 验证是否已存在
  apiFetch('/api/templates/categories').then(function(cats){
    var exists=cats.some(function(c){return c.name===name});
    if(exists){toast('分类「'+name+'」已存在','err');cancelNewCategory();return}
    // 创建分类
    apiFetch('/api/templates/categories',{method:'POST',body:JSON.stringify({new_name:name})}).then(function(){
      toast('分类创建成功 ✅','ok');
      // 刷新分类列表
      loadTemplateCategories();
      // 恢复按钮状态
      cancelNewCategory();
      // 选中新分类
      _curTplCategory=name;loadTemplates(name);
    }).catch(function(e){toast('创建分类失败: '+(e.message||'未知错误'),'err')})
  }).catch(function(){toast('验证分类失败','err')})
}

function cancelNewCategory(){
  var inp=$('tplNewCatInput');if(inp)inp.outerHTML='<span class="tpl-new-cat" id="tplNewCatBtn" onclick="startNewCategory()" title="新建分类">＋</span>';
}

function startRenameCategory(oldName,el){
  // 阻止冒泡，防止切换分类
  var span=el;
  var input='<input class="tpl-cat-inline" id="tplRenameInput" value="'+esc(oldName)+'" maxlength="20" onkeydown="if(event.key===\'Enter\')saveRenameCategory(\''+esc(oldName)+'\')" onblur="cancelRenameCategory(\''+esc(oldName)+'\')">';
  span.outerHTML=input;
  setTimeout(function(){var inp=$('tplRenameInput');if(inp){inp.focus();inp.select()}},50)
}

function saveRenameCategory(oldName){
  var newName=($('tplRenameInput').value||'').trim();
  if(!newName||newName===oldName){cancelRenameCategory(oldName);return}
  apiFetch('/api/templates/categories/'+encodeURIComponent(oldName),{method:'PUT',body:JSON.stringify({new_name:newName})}).then(function(r){
    toast('分类已重命名为「'+newName+'」✅','ok');
    if(_curTplCategory===oldName)_curTplCategory=newName;
    loadTemplateCategories();
    loadTemplates(_curTplCategory);
    // 恢复输入框
    cancelRenameCategory(newName);
  }).catch(function(e){toast('重命名失败: '+(e.message||'未知错误'),'err');cancelRenameCategory(oldName)})
}

function cancelRenameCategory(name){
  var inp=$('tplRenameInput');if(inp){
    var span='<span class="tpl-tab" data-cat="'+esc(name)+'" onclick="loadTemplates(\''+esc(name)+'\')" ondblclick="startRenameCategory(\''+esc(name)+'\',this)">'+esc(name)+'</span>';
    inp.outerHTML=span;
  }
}

function deleteCategory(name){
  confirmm('删除分类','删除分类「'+name+'」后，该分类下的模板将移至「未分类」，是否继续？',function(){
    apiFetch('/api/templates/categories/'+encodeURIComponent(name),{method:'DELETE'}).then(function(r){
      toast(r.message+' ✅','ok');
      if(_curTplCategory===name)_curTplCategory='';
      loadTemplateCategories();
      loadTemplates(_curTplCategory);
    }).catch(function(e){toast('删除失败: '+(e.message||'未知错误'),'err')})
  })
}

/* ---- 模板列表 ---- */
function loadTemplates(category){
  _curTplCategory=category||'';
  // 更新标签状态
  var tabs=document.querySelectorAll('.tpl-tab');
  tabs.forEach(function(t){
    var cat=t.getAttribute('data-cat')||'';
    if(cat===_curTplCategory)t.classList.add('on');else t.classList.remove('on')
  });

  var url='/api/templates'+(category?'?category='+encodeURIComponent(category):'');
  apiFetch(url).then(function(res){
    var items=Array.isArray(res)?res:(res.items||[]);
    var h='';
    if(items.length===0)h='<div class="empty"><p>该分类暂无模板</p><button class="btn btn-p btn-sm" onclick="navToNewTemplate(\''+esc(category)+'\')">＋ 新建模板</button></div>';
    else items.forEach(function(t){
      h+='<div class="tpl-card">';
      h+='<div class="tpl-card-acts">';
      h+='<button class="btn btn-o btn-sm" onclick="editTemplate('+t.id+')" title="编辑模板">✏️</button>';
      h+='<button class="btn btn-d btn-sm" onclick="deleteTemplate('+t.id+')" title="删除模板">🗑</button>';
      h+='</div>';
      h+='<h4>📝 '+esc(t.name)+'</h4>';
      h+='<div class="tpl-card-meta"><span class="cat-badge">'+esc(t.category)+'</span></div>';
      h+='<p>'+esc(t.description)+'</p>';
      h+='<button class="btn btn-p btn-sm" onclick="useTemplate('+t.id+')">📝 使用此模板</button>';
      h+='</div>';
    });
    if($('tplGrid'))$('tplGrid').innerHTML=h;
  }).catch(function(){if($('tplGrid'))$('tplGrid').innerHTML='<div class="empty"><p>加载模板失败</p></div>'})
}

function useTemplate(tplId){
  apiFetch('/api/cases?limit=200').then(function(res){
    var cases=Array.isArray(res)?res:(res.items||[]);
    var activeCases=cases.filter(function(c){return c.case_stage!=='结案'&&c.case_stage!=='closed'});
    var h='<p style="margin-bottom:12px;font-size:13px">请选择关联案件，模板变量将自动填充：</p>';
    h+='<div class="fg"><label>关联案件 <span class="req">*</span></label><select id="cf_tplCaseId"><option value="">-- 请选择案件 --</option>';
    activeCases.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.case_number)+' - '+esc(c.case_reason||'')+'</option>'});
    h+='</select></div>';
    fmodal('选择案件',h,function(){
      var caseId=parseInt($('cf_tplCaseId').value);
      if(!caseId){toast('请选择案件','err');return}
      closemodal();navToTemplateEditor(tplId,caseId)
    })
  }).catch(function(){toast('加载案件列表失败','err')})
}

function loadTemplateEditor(){
  var s=_tplEditorState;if(!s){$('tplEditorArea').innerHTML='<div class="empty"><p>编辑器参数缺失，请从模板中心进入</p></div>';return}

  if(s.mode==='create'){
    // ===== 新建模板模式 =====
    loadCreateEditor(s);
  }else if(s.mode==='edit'){
    // ===== 编辑模板模式 =====
    apiFetch('/api/templates/'+s.templateId).then(function(tpl){
      loadCreateEditor(s,tpl);
    }).catch(function(e){$('tplEditorArea').innerHTML='<div class="empty"><p>加载模板失败</p></div>'})
  }else if(s.mode==='blank'){
    // ===== 新建空白文档模式 =====
    loadDocEditor(s,null);
  }else if(s.mode==='editdoc'){
    // ===== 编辑已有文档（草稿或已上传Word） =====
    apiFetch('/api/documents/'+s.docId+'/content').then(function(res){
      loadDocEditor(s,res);
    }).catch(function(e){$('tplEditorArea').innerHTML='<div class="empty"><p>加载文档失败: '+esc(e.message||'')+'</p></div>'})
  }else{
    // ===== 使用模板模式（原逻辑） =====
    Promise.all([
      apiFetch('/api/templates/'+s.templateId).catch(function(){return null}),
      apiFetch('/api/cases/'+s.caseId).catch(function(){return null}),
      s.draftId?apiFetch('/api/documents/'+s.draftId).catch(function(){return null}):Promise.resolve(null)
    ]).then(function(results){
      var tpl=results[0],cs=results[1],draft=results[2];
      var title=tpl?tpl.name:'文档';var category=tpl?tpl.category:'';

      var h='<div class="editor-container">';
      h+='<button class="back-btn" onclick="navTo(\'templateCenter\')" style="margin-bottom:10px">← 返回模板中心</button>';
      // 信息栏
      h+='<div class="editor-info-bar">';
      h+='<div class="ei-field"><label>案件：</label><input id="ei_caseNumber" value="'+esc(cs?cs.case_number:'')+'" style="width:180px"></div>';
      h+='<div class="ei-field"><label>委托人：</label><input id="ei_client" value="'+esc(cs&&cs.clients&&cs.clients[0]?cs.clients[0].name:'')+'" style="width:120px"></div>';
      h+='<div class="ei-field"><label>对方：</label><input id="ei_opponent" value="'+esc(cs?oppositeParty(cs):'')+'" style="width:120px"></div>';
      h+='<div class="ei-field"><label>法院：</label><input id="ei_court" value="'+esc(cs?cs.court:'')+'" style="width:140px"></div>';
      h+='<button class="btn btn-o btn-sm" onclick="insertVariable()">📥 插入变量</button>';
      h+='</div>';
      // 编辑器
      h+='<div id="tplEditor"></div>';
      // 操作按钮
      h+='<div class="editor-actions">';
      h+='<button class="btn btn-p" onclick="saveDraft(\''+esc(title)+'\',\''+esc(category)+'\')">💾 保存草稿</button>';
      h+='<button class="btn btn-s" onclick="exportDocument(\'docx\',\''+esc(title)+'\')">📄 导出 Word</button>';
      h+='<button class="btn btn-o" onclick="exportDocument(\'pdf\',\''+esc(title)+'\')">📄 导出 PDF</button>';
      h+='</div></div>';
      $('tplEditorArea').innerHTML=h;

      setTimeout(function(){
        var content='';
        if(draft&&draft.editor_content)content=draft.editor_content;
        else if(tpl&&cs){content=fillTemplateVars(tpl.content,cs)}
        var ql=new Quill('#tplEditor',{theme:'snow',modules:{toolbar:[['bold','underline'],[{header:[1,2,3,false]}],[{list:'ordered'},{list:'bullet'}],[{align:[]}],['blockquote']]}});
        if(content)ql.root.innerHTML=content;
        window._tplQuill=ql;
        // 缓存案件数据供导出使用
        _tplEditorState._caseData=cs;
      },200)
    }).catch(function(e){console.error(e);$('tplEditorArea').innerHTML='<div class="empty"><p>加载编辑器失败</p></div>'})
  }
}

function documentTitle(){
  var t=$('ed_title')?$('ed_title').value.trim():'';
  return t||'文档';
}

/* ---- 统一保存 ---- */
function saveDocument(){
  if(!window._tplQuill){toast('编辑器未初始化','err');return}
  var s=_tplEditorState;
  var title=documentTitle();
  var cat=$('ed_category')?$('ed_category').value:'other';
  if(!title){toast('请输入文档名称','err');return}
  var html=window._tplQuill.root.innerHTML;
  var data={editor_content:html,original_name:title,doc_category:cat,case_id:s.caseId||null};

  var url, method;
  if(s.docId&&s.isDraft===0){ url='/api/documents/'+s.docId+'/content'; method='PUT'; }
  else if(s.docId){ url='/api/documents/'+s.docId; method='PUT'; }
  else { url='/api/documents'; method='POST'; data.is_draft=1; }

  apiFetch(url,{method:method,body:JSON.stringify(data)}).then(function(r){
    if(!s.docId){s.docId=r.id;s.draftId=r.id;_tplEditorState=s}
    toast('已保存 ✅','ok');
  }).catch(function(e){toast('保存失败: '+(e.message||'未知错误'),'err')})
}

            ['blank']  // 自定义：插入挖空
          ],
          handlers:{'blank':function(){insertBlankVar()}}
        }}
      });
      if(existing&&existing.content)ql.root.innerHTML=existing.content;
      window._tplQuill=ql;

}

/* ---- 插入挖空 ---- */
function insertBlankVar(){
  if(!window._tplQuill)return;
  var range=window._tplQuill.getSelection();
  if(range&&range.length>0){
    // 有选中文字 → 弹出命名对话框
    var text=window._tplQuill.getText(range.index,range.length).trim();
    var varName=text||'变量';
    var h='<div class="fg"><label>变量名称</label><input type="text" id="cf_varName" value="'+esc(varName)+'"></div>';
    h+='<p style="font-size:11px;color:var(--tx3);margin-top:6px">将生成 <code>{'+esc(varName)+'}</code> 占位符，使用时由案件信息自动替换</p>';
    fmodal('插入挖空',h,function(){
      var name=($('cf_varName').value||'').trim();
      if(!name){toast('请输入变量名称','err');return}
      // 删除选中文字，插入变量占位符
      window._tplQuill.deleteText(range.index,range.length);
      window._tplQuill.insertText(range.index,'{'+name+'}');
      closemodal();
      refreshCustomVars()
    })
  }else{
    // 无选中 → 弹出新建变量对话框
    var h2='<div class="fg"><label>变量名称</label><input type="text" id="cf_varName" placeholder="例如：赔偿金额"></div>';
    h2+='<p style="font-size:11px;color:var(--tx3);margin-top:6px">将生成 <code>{变量名}</code> 占位符，使用时需手动填写</p>';
    fmodal('新建变量',h2,function(){
      var name=($('cf_varName').value||'').trim();
      if(!name){toast('请输入变量名称','err');return}
      var range2=window._tplQuill.getSelection();
      var idx=range2?range2.index:window._tplQuill.getLength()-1;
      window._tplQuill.insertText(idx,'{'+name+'}');
      closemodal();
      refreshCustomVars()
    })
  }
}

function refreshCustomVars(){
  if(!window._tplQuill)return;
  var html=window._tplQuill.root.innerHTML;
  var vars=extractVars(html);
  var builtIn=['{委托人}','{对方当事人}','{受理法院}','{案由}','{当前日期}'];
  var panel=$('tplCustVars');if(!panel)return;
  var h='';
  vars.forEach(function(v){
    if(builtIn.indexOf(v)===-1){
      h+='<span class="tpl-var-tag" onclick="insertVarAtCursor(\''+esc(v)+'\')">'+esc(v)+'<span class="var-del" onclick="event.stopPropagation();removeCustomVar(\''+esc(v)+'\')">×</span></span>';
    }
  });
  panel.innerHTML=h
}

function removeCustomVar(name){
  if(!window._tplQuill)return;
  var html=window._tplQuill.root.innerHTML;
  window._tplQuill.root.innerHTML=html.split(name).join('');
  refreshCustomVars()
}

/* ---- 保存模板 ---- */
function saveTemplate(){
  if(!window._tplQuill){toast('编辑器未初始化','err');return}
  var s=_tplEditorState;if(!s){toast('状态丢失','err');return}
  var name=($('cf_tplName').value||'').trim();
  if(!name){toast('请输入模板名称','err');return}

  var categorySel=$('cf_tplCategory');var category=categorySel?categorySel.value:'';
  if(category==='__new__'){
    category=($('cf_tplNewCategory').value||'').trim();
    if(!category){toast('请输入新分类名称','err');return}
  }
  if(!category){toast('请选择模板分类','err');return}

  var desc=($('cf_tplDesc').value||'').trim();
  var content=window._tplQuill.root.innerHTML;

  var data={category:category,name:name,description:desc,content:content};

  if(s.mode==='edit'&&s.templateId){
    // 更新已有模板
    apiFetch('/api/templates/'+s.templateId,{method:'PUT',body:JSON.stringify(data)}).then(function(){
      toast('模板已保存 ✅','ok');
      navTo('templateCenter');
      setTimeout(function(){loadTemplateCategories();loadTemplates(category)},100)
    }).catch(function(e){toast('保存失败: '+(e.message||'未知错误'),'err')})
  }else{
    // 新建模板
    // 如果是新建分类，先创建分类
    var createTpl=function(){
      apiFetch('/api/templates/',{method:'POST',body:JSON.stringify(data)}).then(function(){
        toast('模板创建成功 ✅','ok');
        navTo('templateCenter');
        setTimeout(function(){loadTemplateCategories();loadTemplates(category)},100)
      }).catch(function(e){toast('创建失败: '+(e.message||'未知错误'),'err')})
    };

    if(categorySel&&categorySel.value==='__new__'){
      // 新分类先创建
      apiFetch('/api/templates/categories',{method:'POST',body:JSON.stringify({new_name:category})}).then(function(){
        createTpl()
      }).catch(function(e){
        // 分类可能已存在（并发），直接创建模板
        if(e.message&&e.message.indexOf('已存在')!==-1)createTpl();
        else toast('创建分类失败: '+(e.message||'未知错误'),'err')
      })
    }else{createTpl()}
  }
}

/* ---- 导出文档 ---- */
function exportDocument(format,title){
  var html='';
  if(window._tplQuill)html=window._tplQuill.root.innerHTML;
  if(!html){toast('编辑器内容为空','err');return}
  // 优先取编辑器名称输入框的值
  var t=documentTitle();
  if(!t||t==='文档')t=title||'文档';
  var s=_tplEditorState;
  var cs=s?s._caseData:null;
  if(cs)html=fillTemplateVars(html,cs);
  var fullUrl=API+'/api/documents/export';
  if(_TQ)fullUrl+='?'+_TQ;
  var xhr=new XMLHttpRequest();xhr.open('POST',fullUrl,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.responseType='blob';
  xhr.onload=function(){if(xhr.status===200){var blob=xhr.response;var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=t+'.'+format;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}else{toast('导出失败','err')}};
  xhr.onerror=function(){toast('导出失败: 网络错误','err')};
  xhr.send(JSON.stringify({format:format,html:html,title:t}));
}

function loadRetainerList(){

      return;
    }
    var h='<div class="rt-card-grid">';
    items.forEach(function(r){

      var statusCls='rt-status-'+r.status;
      h+='<div class="rt-card" onclick="navToRetainer('+r.id+')">';
      h+='<div class="rtc-top"><span class="rtc-name">'+esc(r.client_name)+'</span><span class="rtc-status '+statusCls+'">'+statusLabel+'</span></div>';
      h+='<div class="rtc-meta">';

      h+='<div><span>💰 合同金额：<b>'+fma(r.contract_amount)+'</b></span><span>📋 本月工作：<b>'+r.month_count+'次 / '+r.month_hours+'h</b></span></div>';
      h+='</div>';

      if(r.status==='expired')pct=100;
      if(isNaN(pct))pct=0;
      h+='<div class="rtc-bar"><div class="rtc-bar-inner '+r.status+'" style="width:'+pct+'%"></div></div>';
      h+='</div>';
    });
    h+='</div>';
    if($('rtListArea'))$('rtListArea').innerHTML=h;
  }).catch(function(e){
    if($('rtListArea'))$('rtListArea').innerHTML='<div class="rt-empty"><div class="rte-text">加载失败：'+esc(e.message||'网络错误')+'</div></div>';
  })
}

/* ---- 新建/编辑常法客户弹窗 ---- */
function newRetainer(id){
  var isEdit=!!id;
  var title=isEdit?'编辑常法客户':'新建常法客户';
  var h='<div style="max-height:70vh;overflow-y:auto;padding-right:4px">';
  // 客户名称（带搜索）
  h+='<div class="fg"><label>客户名称 <span style="color:var(--warn)">*</span></label>';
  h+='<div class="ac-wrap" id="rtClientAcWrap"><input type="text" id="rtClientName" autocomplete="off" placeholder="输入客户名称搜索或新建..." oninput="searchRetainerClient(this.value)"><div class="ac-dd" id="rtClientDd"></div></div></div>';
  // 服务期限
  h+='<div class="fg"><label>服务期限 <span style="color:var(--warn)">*</span></label>';
  h+='<div style="display:flex;gap:8px;align-items:center"><input type="date" id="rtStartDate" style="flex:1"> <span style="color:var(--tx3)">至</span> <input type="date" id="rtEndDate" style="flex:1"></div></div>';
  // 合同金额 + 付款方式
  h+='<div class="fg"><label>合同金额（元）</label><input type="number" id="rtAmount" placeholder="0" step="0.01" min="0"></div>';
  h+='<div class="fg"><label>付款方式</label><select id="rtPayMethod"><option value="">请选择</option><option value="once">一次性付清</option><option value="quarterly">按季度支付</option><option value="half_yearly">按半年支付</option><option value="annual">按年支付</option></select></div>';
  // 服务范围
  h+='<div class="fg"><label>服务内容范围</label><div id="rtScopeCbs" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 0"></div></div>';
  // 合同编号
  h+='<div class="fg"><label>合同编号</label><input type="text" id="rtContractNum" placeholder="如 HT-2026-001"></div>';
  // 对接人
  h+='<div style="display:flex;gap:10px"><div class="fg" style="flex:1"><label>主要对接人</label><input type="text" id="rtContact" placeholder="姓名"></div><div class="fg" style="flex:1"><label>联系方式</label><input type="text" id="rtContactPhone" placeholder="电话"></div></div>';
  // 驻场 + 备注
  h+='<div class="fg"><label><input type="checkbox" id="rtOnsite"> 有驻场要求</label></div>';
  h+='<div class="fg"><label>备注</label><textarea id="rtNotes" rows="2" placeholder="其他需要说明的信息"></textarea></div>';
  h+='</div>';

  fmodal(title,h,function(){
    var clientName=$('rtClientName').value.trim();
    if(!clientName){toast('请输入客户名称','e');return}
    var startDate=$('rtStartDate').value;
    var endDate=$('rtEndDate').value;
    if(!startDate||!endDate){toast('请选择服务期限','e');return}
    // 收集服务范围
    var scopes=[];
    var cbs=document.querySelectorAll('#rtScopeCbs input[type="checkbox"]:checked');
    cbs.forEach(function(cb){scopes.push(cb.value)});
    // 获取已选客户ID
    var selectedClientId=null;
    var acItem=document.querySelector('#rtClientDd .ac-item.sel');
    if(acItem)selectedClientId=parseInt(acItem.getAttribute('data-id'));

    var body={
      client_id:selectedClientId||null,
      client_name:clientName,
      service_start_date:startDate+'T00:00:00',
      service_end_date:endDate+'T00:00:00',
      contract_amount:parseFloat($('rtAmount').value)||0,
      payment_method:$('rtPayMethod').value,
      service_scope:JSON.stringify(scopes),
      has_onsite:$('rtOnsite').checked,
      contact_name:$('rtContact').value.trim(),
      contact_phone:$('rtContactPhone').value.trim(),
      contract_number:$('rtContractNum').value.trim(),
      notes:$('rtNotes').value.trim()
    };

    var url='/api/retainer/clients';
    var method='POST';
    if(isEdit){
      url+='/'+id;
      method='PUT';
    }
    apiFetch(url,{method:method,body:JSON.stringify(body)}).then(function(r){
      closemodal();
      toast(isEdit?'已更新':'常法客户已创建');
      if(isEdit)loadRetainerDetail(id);
      else navToRetainer(r.id);
    }).catch(function(e){toast((isEdit?'更新':'创建')+'失败：'+e.message,'e')})
  });

  // 加载服务范围checkbox
  loadRetainerScopeCheckboxes();

  // 如果是编辑模式，加载数据
  if(isEdit){
    apiFetch('/api/retainer/clients/'+id).then(function(r){
      setTimeout(function(){
        if($('rtClientName'))$('rtClientName').value=r.client_name||'';
        if($('rtStartDate'))$('rtStartDate').value=(r.service_start_date||'').slice(0,10);
        if($('rtEndDate'))$('rtEndDate').value=(r.service_end_date||'').slice(0,10);
        if($('rtAmount'))$('rtAmount').value=r.contract_amount||0;
        if($('rtPayMethod'))$('rtPayMethod').value=r.payment_method||'';
        if($('rtContractNum'))$('rtContractNum').value=r.contract_number||'';
        if($('rtContact'))$('rtContact').value=r.contact_name||'';
        if($('rtContactPhone'))$('rtContactPhone').value=r.contact_phone||'';
        if($('rtOnsite'))$('rtOnsite').checked=r.has_onsite||false;
        if($('rtNotes'))$('rtNotes').value=r.notes||'';
        // 勾选服务范围
        if(r.service_scope){
          try{var scopes=typeof r.service_scope==='string'?JSON.parse(r.service_scope):r.service_scope;
            scopes.forEach(function(s){
              var cb=document.querySelector('#rtScopeCbs input[value="'+s+'"]');
              if(cb)cb.checked=true;
            });
          }catch(ex){}
        }
      },100);
    }).catch(function(){})
  }
}

    h+='<b style="font-size:16px">'+esc(r.client_name)+'</b>';
    h+='<span style="font-size:12px;color:var(--tx3);margin-left:10px">'+(r.service_start_date||'').slice(0,10)+' ~ '+(r.service_end_date||'').slice(0,10)+'</span></div>';

    h+='<div class="rt-tab'+( _retainerTab==='work'?' on':'')+'" onclick="_retainerTab=\'work\';loadRetainerDetail('+r.id+')">📝 工作记录</div>';
    h+='<div class="rt-tab'+( _retainerTab==='contract'?' on':'')+'" onclick="_retainerTab=\'contract\';loadRetainerDetail('+r.id+')">📋 合同与费用</div>';
    h+='<div class="rt-tab'+( _retainerTab==='stats'?' on':'')+'" onclick="_retainerTab=\'stats\';loadRetainerDetail('+r.id+')">📊 统计概览</div>';
    h+='</div><div id="rtTabContent">加载中...</div>';
    h+='</div>';

    // 右侧栏
    h+='<div class="rt-detail-side">';
    h+='<div class="rt-side-card"><div class="rtsc-title">👤 客户信息</div>';
    h+='<div class="rtsc-row"><span class="rtsc-lbl">对接人</span><span class="rtsc-val">'+esc(r.contact_name||'—')+'</span></div>';
    h+='<div class="rtsc-row"><span class="rtsc-lbl">电话</span><span class="rtsc-val">'+esc(r.contact_phone||'—')+'</span></div>';
    if(r.contract_number)h+='<div class="rtsc-row"><span class="rtsc-lbl">合同编号</span><span class="rtsc-val">'+esc(r.contract_number)+'</span></div>';
    h+='</div>';
    h+='<div class="rt-side-card"><div class="rtsc-title">📋 本月摘要</div>';
    h+='<div class="rtsc-row"><span class="rtsc-lbl">工作次数</span><span class="rtsc-val">'+(r.month_count||0)+' 次</span></div>';
    h+='<div class="rtsc-row"><span class="rtsc-lbl">工作小时</span><span class="rtsc-val">'+(r.month_hours||0)+' h</span></div>';
    h+='<div class="rtsc-row"><span class="rtsc-lbl">剩余天数</span><span class="rtsc-val">'+du+' 天</span></div>';
    h+='</div>';
    h+='<div class="rt-side-card"><div class="rtsc-title">⚡ 快速操作</div>';
    h+='<button class="rtsc-btn" onclick="newWorkRecord('+r.id+')">+ 新增工作记录</button>';
    h+='<button class="rtsc-btn" onclick="newPayment('+r.id+')">+ 添加付款记录</button>';
    h+='<button class="rtsc-btn" onclick="generateRetainerReport('+r.id+')">📄 生成工作报告</button>';
    h+='</div>';
    // 关联诉讼案件（如果有关联client_id）
    if(r.client_id){
      h+='<div class="rt-side-card"><div class="rtsc-title">⚖️ 关联案件</div><div id="rtRelatedCases" style="font-size:12px;color:var(--tx3)">加载中...</div></div>';
    }
    h+='</div></div>';

    if($('retainerDetailArea'))$('retainerDetailArea').innerHTML=h;

    // 加载标签页内容
    if(_retainerTab==='work')loadRetainerWorkRecords(id);
    else if(_retainerTab==='contract')loadRetainerContract(id);

    // 加载关联案件
    if(r.client_id)loadRetainerRelatedCases(r.client_id);

/* ---- 标签页一：工作记录 ---- */
function loadRetainerWorkRecords(id){
  apiFetch('/api/retainer/clients/'+id+'/work-records?limit=500').then(function(res){
    var items=res.items||[];
    var h='<div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">';
    h+='<span style="font-size:13px;color:var(--tx2)">共 <b>'+res.total+'</b> 条记录，合计 <b>'+res.total_hours+'</b> 小时</span>';
    h+='<button class="btn btn-p btn-sm" onclick="newWorkRecord('+id+')">+ 新增工作记录</button></div>';
    if(items.length===0){
      h+='<div class="rt-empty"><div class="rte-icon">📝</div><div class="rte-text">暂无工作记录</div></div>';
    }else{
      items.forEach(function(w){
        var typeLabel=w.work_type;
        h+='<div class="wr-card">';
        h+='<div class="wr-top"><div><span class="wr-type">'+esc(typeLabel)+'</span><span class="wr-date">'+(w.date||'').slice(0,10)+'</span></div><span class="wr-hours">'+w.hours+'h</span></div>';
        if(w.description)h+='<div class="wr-desc">'+esc(w.description)+'</div>';
        if(w.participants)h+='<div class="wr-meta">👤 '+esc(w.participants)+'</div>';
        h+='<div class="wr-actions"><button class="btn btn-o btn-sm" onclick="editWorkRecord('+id+','+w.id+')">✏️</button><button class="btn btn-d btn-sm" onclick="deleteWorkRecord('+id+','+w.id+')">🗑️</button></div>';
        h+='</div>';
      });
    }
    if($('rtTabContent'))$('rtTabContent').innerHTML=h;
  }).catch(function(e){
    if($('rtTabContent'))$('rtTabContent').innerHTML='<div class="rt-empty"><div class="rte-text">加载失败</div></div>';
  })
}

function newWorkRecord(id,wid){
  var isEdit=!!wid;
  var title=isEdit?'编辑工作记录':'新增工作记录';
  var h='<div class="fg"><label>工作日期 <span style="color:var(--warn)">*</span></label><input type="date" id="wrDate"></div>';
  h+='<div class="fg"><label>工作类型</label><select id="wrType">';
  h+='<option value="contract_review">合同审查</option><option value="legal_opinion">法律意见书</option><option value="legal_consultation">法律咨询</option><option value="policy_analysis">政策法规分析</option><option value="labor_relations">劳动人事合规</option><option value="ip_advice">知识产权建议</option><option value="dispute_mediation">纠纷调解/协商</option><option value="legal_training">法律培训/讲座</option><option value="onsite_service">驻场服务</option><option value="litigation">诉讼代理</option><option value="meeting">会议/汇报</option><option value="other">其他</option>';
  h+='</select></div>';
  h+='<div class="fg"><label>工作内容</label><textarea id="wrDesc" rows="3" placeholder="简要描述工作内容..."></textarea></div>';
  h+='<div style="display:flex;gap:10px"><div class="fg" style="flex:1"><label>服务时长（小时）</label><input type="number" id="wrHours" placeholder="0" step="0.5" min="0"></div><div class="fg" style="flex:1"><label>参与人员</label><input type="text" id="wrParticipants" placeholder="律师姓名"></div></div>';
  h+='<div class="fg"><label>关联事项编号</label><input type="text" id="wrRefNum" placeholder="如案号、合同编号等"></div>';

  fmodal(title,h,function(){
    var dt=$('wrDate').value;
    if(!dt){toast('请选择工作日期','e');return}
    var body={date:dt+'T00:00:00',work_type:$('wrType').value,description:$('wrDesc').value.trim(),hours:parseFloat($('wrHours').value)||0,participants:$('wrParticipants').value.trim(),reference_number:$('wrRefNum').value.trim()};
    var url='/api/retainer/clients/'+id+'/work-records';
    var method='POST';
    if(isEdit){url+='/'+wid;method='PUT'}
    apiFetch(url,{method:method,body:JSON.stringify(body)}).then(function(){
      closemodal();toast(isEdit?'已更新':'工作记录已添加');
      loadRetainerDetail(id);
    }).catch(function(e){toast((isEdit?'更新':'添加')+'失败：'+e.message,'e')})
  });

  if(isEdit){
    apiFetch('/api/retainer/clients/'+id+'/work-records?limit=500').then(function(res){
      var w=(res.items||[]).find(function(x){return x.id===wid});
      if(!w)return;
      setTimeout(function(){
        if($('wrDate'))$('wrDate').value=(w.date||'').slice(0,10);
        if($('wrType'))$('wrType').value=w.work_type||'other';
        if($('wrDesc'))$('wrDesc').value=w.description||'';
        if($('wrHours'))$('wrHours').value=w.hours||0;
        if($('wrParticipants'))$('wrParticipants').value=w.participants||'';
        if($('wrRefNum'))$('wrRefNum').value=w.reference_number||'';
      },100);
    }).catch(function(){})
  }
}

function editWorkRecord(id,wid){newWorkRecord(id,wid)}
function deleteWorkRecord(id,wid){
  confirmm('确认删除','确定要删除这条工作记录吗？此操作不可恢复。',function(){
    apiFetch('/api/retainer/clients/'+id+'/work-records/'+wid,{method:'DELETE'}).then(function(){
      toast('已删除');loadRetainerDetail(id);
    }).catch(function(e){toast('删除失败：'+e.message,'e')})
  })
}

        h+='<div style="margin-top:8px"><span style="font-size:12px;color:var(--tx3)">📎 合同文件已上传</span> <button class="btn btn-o btn-sm" onclick="window.open(\'/api/retainer/clients/'+id+'/contract-file\')">下载</button></div>';
      }
      h+='<div style="margin-top:8px"><input type="file" id="rtContractFile" style="display:none" onchange="uploadRetainerContract('+id+',this)"><button class="btn btn-o btn-sm" onclick="document.getElementById(\'rtContractFile\').click()">📤 '+(r.contract_file_path?'重新上传':'上传合同文件')+'</button></div>';
      h+='</div></div>';

      // 付款汇总
      h+='<div class="pm-summary">';
      h+='<div class="pms-item"><div class="pms-val">'+fma(r.contract_amount)+'</div><div class="pms-lbl">合同总额</div></div>';
      h+='<div class="pms-item"><div class="pms-val">'+fma(pres.total_paid)+'</div><div class="pms-lbl">已付金额</div></div>';
      h+='<div class="pms-item"><div class="pms-val unpaid">'+fma(pres.unpaid_amount)+'</div><div class="pms-lbl">未付金额</div></div>';
      h+='</div>';

      // 付款记录列表
      h+='<div class="pnl"><div class="pnl-hd">💳 付款记录 <button class="btn btn-p btn-sm" style="float:right" onclick="newPayment('+id+')">+ 添加</button></div><div class="pnl-bd">';
      if(payments.length===0){
        h+='<div style="text-align:center;color:var(--tx3);padding:20px">暂无付款记录</div>';

        payments.forEach(function(p){
          h+='<div class="pm-item"><span class="pm-date">'+(p.payment_date||'').slice(0,10)+'</span><span class="pm-notes">'+esc(p.notes||'')+'</span><span class="pm-amount">¥'+fma(p.amount)+'</span>';
          h+='<button class="btn btn-d btn-sm" style="margin-left:8px" onclick="deletePayment('+id+','+p.id+')">🗑️</button>';

function newPayment(id){
  var h='<div class="fg"><label>付款日期 <span style="color:var(--warn)">*</span></label><input type="date" id="pmDate"></div>';
  h+='<div class="fg"><label>付款金额（元）<span style="color:var(--warn)">*</span></label><input type="number" id="pmAmount" placeholder="0" step="0.01" min="0"></div>';
  h+='<div class="fg"><label>备注</label><input type="text" id="pmNotes" placeholder="如：第一季度费用"></div>';
  fmodal('添加付款记录',h,function(){
    var dt=$('pmDate').value,amt=parseFloat($('pmAmount').value)||0;
    if(!dt){toast('请选择付款日期','e');return}
    if(amt<=0){toast('请输入金额','e');return}
    apiFetch('/api/retainer/clients/'+id+'/payments',{method:'POST',body:JSON.stringify({payment_date:dt+'T00:00:00',amount:amt,notes:$('pmNotes').value.trim()})}).then(function(){
      closemodal();toast('付款记录已添加');loadRetainerDetail(id);
    }).catch(function(e){toast('添加失败：'+e.message,'e')})
  })
}

function deletePayment(id,pid){
  confirmm('确认删除','确定要删除这条付款记录吗？',function(){
    apiFetch('/api/retainer/clients/'+id+'/payments/'+pid,{method:'DELETE'}).then(function(){
      toast('已删除');loadRetainerDetail(id);
    }).catch(function(e){toast('删除失败：'+e.message,'e')})
  })
}

function uploadRetainerContract(id,input){
  var file=input.files[0];if(!file)return;
  var fd=new FormData();fd.append('file',file);
  apiUpload('/api/retainer/clients/'+id+'/contract-file',fd).then(function(){
    toast('合同文件已上传');loadRetainerDetail(id);
  }).catch(function(e){toast('上传失败：'+e.message,'e')})
}

/* ---- 标签页三：统计概览 ---- */
function loadRetainerStats(id){
  apiFetch('/api/retainer/clients/'+id+'/stats').then(function(st){
    var h='';
    // 4数字卡
    h+='<div class="rt-stat-cards">';
    h+='<div class="rt-stat-card"><div class="rtsc-num">'+st.total_count+'</div><div class="rtsc-lbl">工作总次数</div></div>';
    h+='<div class="rt-stat-card"><div class="rtsc-num">'+st.total_hours+'</div><div class="rtsc-lbl">工作总时长(h)</div></div>';
    h+='<div class="rt-stat-card"><div class="rtsc-num">'+st.avg_monthly_hours+'</div><div class="rtsc-lbl">平均月工时(h)</div></div>';
    h+='<div class="rt-stat-card"><div class="rtsc-num" style="color:'+(st.days_remaining<0?'var(--warn)':(st.days_remaining<=30?'#c4816b':'var(--accent)'))+'">'+st.days_remaining+'</div><div class="rtsc-lbl">剩余天数</div></div>';
    h+='</div>';

    // 按类型分布
    h+='<div class="rt-chart-wrap"><div class="rt-chart-title">📊 工作类型分布</div>';
    if(st.type_distribution&&st.type_distribution.length>0){
      h+='<div style="max-height:200px;overflow-y:auto"><table style="width:100%;font-size:12px"><thead><tr><th style="text-align:left">类型</th><th style="text-align:right">小时数</th><th style="text-align:right">占比</th></tr></thead><tbody>';
      st.type_distribution.forEach(function(t){
        var pct=st.total_hours>0?Math.round(t.hours/st.total_hours*100):0;
        h+='<tr><td>'+esc(t.label||t.type)+'</td><td style="text-align:right">'+t.hours+'h</td><td style="text-align:right"><div style="display:inline-block;width:40px;height:4px;background:var(--light);border-radius:2px;vertical-align:middle;margin-right:4px"><div style="height:100%;background:var(--accent);border-radius:2px;width:'+pct+'%"></div></div>'+pct+'%</td></tr>';
      });
      h+='</tbody></table></div>';

      // 饼图容器（如果Chart.js可用）
      h+='<div style="margin-top:10px"><canvas id="rtTypeChart" style="max-height:200px"></canvas></div>';
      setTimeout(function(){
        if(typeof Chart==='undefined')return;
        var ctx=document.getElementById('rtTypeChart');if(!ctx)return;
        var colors=['#7a9a7e','#b09878','#c4816b','#8c8c8c','#5b6e7a','#a09080','#6b7b8a','#9a8a7a','#7a8a8a'];
        new Chart(ctx,{type:'doughnut',data:{labels:st.type_distribution.map(function(t){return t.label||t.type}),datasets:[{data:st.type_distribution.map(function(t){return t.hours}),backgroundColor:colors.slice(0,st.type_distribution.length)}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}});
      },200);
    }else{h+='<div style="text-align:center;color:var(--tx3);padding:20px">暂无数据</div>'}
    h+='</div>';

    // 月度趋势
    h+='<div class="rt-chart-wrap"><div class="rt-chart-title">📈 月度工作量趋势</div><canvas id="rtMonthChart" style="max-height:200px"></canvas></div>';
    setTimeout(function(){
      if(typeof Chart==='undefined')return;
      var ctx=document.getElementById('rtMonthChart');if(!ctx)return;
      var months=st.monthly_trend||[];
      new Chart(ctx,{type:'bar',data:{labels:months.map(function(m){return m.label}),datasets:[{label:'小时数',data:months.map(function(m){return m.hours}),backgroundColor:months.map(function(m,i){return i===months.length-1?'#b09878':'#d4cfc6'})}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'小时'}}}}});
    },200);

    if($('rtTabContent'))$('rtTabContent').innerHTML=h;
  }).catch(function(e){
    if($('rtTabContent'))$('rtTabContent').innerHTML='<div class="rt-empty"><div class="rte-text">加载统计失败</div></div>';
  })
}

/* ---- 续签 / 归档操作 ---- */
function renewRetainer(id){
  apiFetch('/api/retainer/clients/'+id).then(function(r){
    var h='<div class="fg"><label>当前到期日</label><div style="font-size:13px;color:var(--tx2)">'+(r.service_end_date||'').slice(0,10)+'</div></div>';
    h+='<div class="fg"><label>新到期日 <span style="color:var(--warn)">*</span></label><input type="date" id="rnNewEnd"></div>';
    h+='<div class="fg"><label>新合同金额（元，留空沿用原金额）</label><input type="number" id="rnAmount" placeholder="'+r.contract_amount+'" step="0.01" min="0"></div>';
    h+='<div class="fg"><label>备注</label><textarea id="rnNotes" rows="2" placeholder="续签说明..."></textarea></div>';
    fmodal('🔄 续签常法合同',h,function(){
      var newEnd=$('rnNewEnd').value;
      if(!newEnd){toast('请选择新到期日','e');return}
      apiFetch('/api/retainer/clients/'+id+'/renew',{method:'POST',body:JSON.stringify({new_end_date:newEnd+'T00:00:00',contract_amount:parseFloat($('rnAmount').value)||0,notes:$('rnNotes').value.trim()})}).then(function(){
        closemodal();toast('已续签');loadRetainerDetail(id);
      }).catch(function(e){toast('续签失败：'+e.message,'e')})
    })
  })
}

/* ---- 报告生成 ---- */
function generateRetainerReport(id){
  apiFetch('/api/retainer/clients/'+id).then(function(r){
    var h='<div class="fg"><label>报告周期</label>';
    h+='<div style="display:flex;gap:6px;align-items:center"><input type="date" id="rpStart" value="'+(r.service_start_date||'').slice(0,10)+'"> <span>至</span> <input type="date" id="rpEnd" value="'+(r.service_end_date||'').slice(0,10)+'"></div></div>';
    h+='<div class="fg"><label>报告概述</label><textarea id="rpSummary" rows="3" placeholder="可选：简要描述本期服务概况..."></textarea></div>';
    h+='<div class="fg"><label>总结与建议</label><textarea id="rpSuggestions" rows="4" placeholder="可选：对本期服务的总结及后续建议..."></textarea></div>';
    fmodal('📄 生成工作报告',h,function(){
      var ps=$('rpStart').value,pe=$('rpEnd').value;
      if(!ps||!pe){toast('请选择报告周期','e');return}
      // 获取期间内的工作记录来生成报告内容
      apiFetch('/api/retainer/clients/'+id+'/work-records?date_from='+ps+'&date_to='+pe+'&limit=1000').then(function(wres){
        apiFetch('/api/retainer/clients/'+id+'/stats').then(function(st){
          // 构建报告内容
          var content={
            summary:$('rpSummary').value.trim(),
            work_summary:{total_count:wres.total||0,total_hours:wres.total_hours||0},
            type_distribution:st.type_distribution||[],
            work_records:(wres.items||[]).map(function(w){return{date:w.date,work_type:w.work_type,description:w.description,hours:w.hours,participants:w.participants}}),
            monthly_trend:st.monthly_trend||[],
            suggestions:$('rpSuggestions').value.trim()
          };
          // 保存报告
          apiFetch('/api/retainer/clients/'+id+'/reports',{method:'POST',body:JSON.stringify({period_start:ps+'T00:00:00',period_end:pe+'T00:00:00',content:JSON.stringify(content)})}).then(function(report){
            closemodal();
            // 显示报告预览
            showReportPreview(id,report.id);
          }).catch(function(e){toast('保存报告失败：'+e.message,'e')})
        }).catch(function(e){toast('获取统计数据失败：'+e.message,'e')})
      }).catch(function(e){toast('获取工作记录失败：'+e.message,'e')})
    })
  })
}

function showReportPreview(id,reportId){
  apiFetch('/api/retainer/clients/'+id+'/reports/'+reportId).then(function(report){
    var content={};
    try{content=typeof report.content==='string'?JSON.parse(report.content):report.content}catch(ex){}
    var ws=content.work_summary||{};
    var records=content.work_records||[];
    var h='<div style="max-height:70vh;overflow-y:auto">';
    h+='<div style="text-align:center;padding:20px"><h3>常法顾问工作报告</h3><p style="color:var(--tx2)">'+esc(content.summary||'')+'</p><p style="color:var(--tx3)">报告期间：'+report.period_start+' ~ '+report.period_end+'</p></div>';
    h+='<h4>一、服务概况</h4><p>工作总次数：<b>'+ws.total_count+'</b> 次 | 工作总时长：<b>'+ws.total_hours+'</b> 小时</p>';
    if(content.type_distribution&&content.type_distribution.length>0){
      h+='<h4>二、工作类型分布</h4><table style="width:100%;font-size:12px"><tr><th>类型</th><th>小时</th><th>占比</th></tr>';
      content.type_distribution.forEach(function(t){
        var pct=ws.total_hours>0?Math.round(t.hours/ws.total_hours*100):0;
        h+='<tr><td>'+esc(t.label||t.type)+'</td><td>'+t.hours+'h</td><td>'+pct+'%</td></tr>';
      });
      h+='</table>';
    }
    if(records.length>0){
      h+='<h4>三、工作明细</h4>';
      // 按月分组
      var grouped={};
      records.forEach(function(w){
        var mk=(w.date||'').slice(0,7);
        if(!grouped[mk])grouped[mk]=[];
        grouped[mk].push(w);
      });
      Object.keys(grouped).sort().forEach(function(mk){
        h+='<h5>'+mk+'</h5><table style="width:100%;font-size:11px"><tr><th>日期</th><th>类型</th><th>内容</th><th>时长</th></tr>';
        grouped[mk].forEach(function(w){
          h+='<tr><td>'+(w.date||'').slice(0,10)+'</td><td>'+esc(w.work_type)+'</td><td>'+esc(w.description||'').slice(0,40)+'</td><td>'+w.hours+'h</td></tr>';
        });
        h+='</table>';
      });
    }
    if(content.suggestions){h+='<h4>四、总结与建议</h4><p>'+esc(content.suggestions)+'</p>'}
    h+='<div style="margin-top:16px;display:flex;gap:8px;justify-content:center">';
    h+='<button class="btn btn-p" onclick="exportRetainerReport('+id+','+reportId+')">📥 导出 PDF</button>';
    h+='<button class="btn btn-o" onclick="closemodal()">关闭</button></div></div>';
    modal(h);
  }).catch(function(e){toast('加载报告失败：'+e.message,'e')})
}

function exportRetainerReport(id,reportId){
  var url='/api/retainer/clients/'+id+'/reports/'+reportId+'/pdf';
  if(_TOKEN)url+='?token='+_TOKEN;
  window.open(url,'_blank');
  toast('报告 PDF 正在下载...');
}

/* ---- AI 助手面板 ---- */

function toggleAiPanel(){
  var panel=$('aiPanel'), mask=$('aiMask');
  var isOpen=panel.classList.contains('open');
  if(isOpen){ panel.classList.remove('open'); mask.classList.remove('open'); }
  else { panel.classList.add('open'); mask.classList.add('open');
    setTimeout(function(){ $('aiInput').focus(); },350); }
}

function switchAiMode(mode){
  _aiMode=mode;
  var tabs=document.querySelectorAll('.ai-tab');
  tabs.forEach(function(t){ t.classList.remove('ac'); });
  var tab=document.querySelector('.ai-tab[data-mode="'+mode+'"]');
  if(tab)tab.classList.add('ac');
  var ph={draft:'请描述案件情况，我将为您起草法律文书…',
          review:'请粘贴需要审查的合同条款…',
          research:'请输入您想检索的法律问题…'};
  $('aiInput').placeholder=ph[mode]||'在此输入您的问题…';

/* localStorage 持久化 */
function saveAiHistory(){
  try {
    var toSave=_aiMessages.slice(-40);  // 最多保存40条
    localStorage.setItem(_AI_STORAGE_KEY, JSON.stringify({mode:_aiMode, messages:toSave}));
  } catch(e){ /* 存储满则忽略 */ }
}

function loadAiHistory(){
  try {
    var raw=localStorage.getItem(_AI_STORAGE_KEY);
    if(!raw)return;
    var data=JSON.parse(raw);
    if(data.mode) _aiMode=data.mode;
    if(data.messages&&data.messages.length){
      _aiMessages=data.messages;
      // 恢复面板内容
      var body=$('aiChatBody');
      var welcome=body.querySelector('.ai-welcome');
      if(welcome)welcome.style.display='none';
      for(var i=0;i<_aiMessages.length;i++){
        appendAiBubble(_aiMessages[i].role, _aiMessages[i].content, true);
      }
      // 恢复 tab 高亮
      var tabs=document.querySelectorAll('.ai-tab');
      tabs.forEach(function(t){ t.classList.remove('ac'); });
      var tab=document.querySelector('.ai-tab[data-mode="'+_aiMode+'"]');
      if(tab)tab.classList.add('ac');
    }
  } catch(e){ /* 解析失败忽略 */ }
}

function sendAiMessage(){
  if(_aiWaiting)return;
  var input=$('aiInput');
  var text=input.value.trim();
  if(!text)return;
  input.value=''; input.style.height='auto';

  // 用户气泡
  appendAiBubble('user',text);
  _aiMessages.push({role:'user',content:text});
  saveAiHistory();

  // 打字动画
  _aiWaiting=true;
  $('aiSendBtn').disabled=true;
  var typingEl=showAiTyping();

  // 构造请求 URL（流式 SSE）
  var sep=_TQ?'?':'';
  var url=API+'/api/ai/stream'+(sep?sep+_TQ:'');

  // 创建 AbortController
  _aiStreamAbort=new AbortController();

  fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode:_aiMode, messages:_aiMessages}),
    signal:_aiStreamAbort.signal
  }).then(function(response){
    if(!response.ok){
      return response.json().then(function(d){
        throw new Error(d.detail||'AI 服务请求失败');
      }).catch(function(pe){
        if(pe.message&&pe.message.indexOf('AI')===0)throw pe;
        throw new Error('AI 服务请求失败');
      });
    }
    // 读取 SSE 流
    var reader=response.body.getReader();
    var decoder=new TextDecoder();
    var buffer='';
    var botMsg='';
    var botDiv=null;
    var firstChunk=true;

    function pump(){
      reader.read().then(function(result){
        if(result.done){
          // 流结束
          removeAiTyping(typingEl);
          if(botMsg){
            _aiMessages.push({role:'assistant',content:botMsg});
            saveAiHistory();
          }
          _aiWaiting=false;
          $('aiSendBtn').disabled=false;
          _aiStreamAbort=null;
          $('aiInput').focus();
          return;
        }
        buffer+=decoder.decode(result.value,{stream:true});
        var lines=buffer.split('\n');
        buffer=lines.pop()||'';  // 最后一个不完整行放回 buffer

        for(var i=0;i<lines.length;i++){
          var line=lines[i].trim();
          if(!line||line==='data: [DONE]')continue;
          if(!line.startsWith('data: '))continue;
          try {
            var payload=JSON.parse(line.slice(6));
            if(payload.error){
              removeAiTyping(typingEl);
              appendAiBubble('assistant','（'+payload.error+'）');
              _aiWaiting=false;$('aiSendBtn').disabled=false;_aiStreamAbort=null;return;
            }
            if(payload.delta){
              if(firstChunk){
                removeAiTyping(typingEl);
                botDiv=appendAiBubble('assistant','',true);
                firstChunk=false;
              }
              botMsg+=payload.delta;
              if(botDiv){
                var textEl=botDiv.querySelector('.ai-msg-text');
                if(textEl)textEl.innerHTML=formatAiContent(botMsg);
              }
            }
          } catch(e){ /* 跳过解析失败的行 */ }
        }
        scrollAiChat();
        pump();  // 继续读取
      }).catch(function(err){
        if(err.name!=='AbortError'){
          removeAiTyping(typingEl);
          appendAiBubble('assistant','（连接中断：'+esc(err.message)+'）');
        }
        if(botMsg){
          _aiMessages.push({role:'assistant',content:botMsg});
          saveAiHistory();
        }
        _aiWaiting=false;$('aiSendBtn').disabled=false;_aiStreamAbort=null;
      });
    }
    pump();
  }).catch(function(err){
    if(err.name!=='AbortError'){
      removeAiTyping(typingEl);
      appendAiBubble('assistant','（请求失败：'+esc(err.message)+'）');
    }
    _aiWaiting=false;$('aiSendBtn').disabled=false;_aiStreamAbort=null;
  });
}

function appendAiBubble(role,text,noScroll){
  var body=$('aiChatBody');
  var welcome=body.querySelector('.ai-welcome');
  if(welcome)welcome.style.display='none';

  var now=new Date();
  var time=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);

  var div=document.createElement('div');
  div.className='ai-msg '+role;
  div.innerHTML='<div class="ai-msg-text">'+(role==='assistant'?formatAiContent(text):esc(text))+'</div><div class="ai-msg-time">'+time+'</div>';

  if(role==='assistant'&&text){
    var actions=document.createElement('div');
    actions.className='ai-msg-actions';
    actions.innerHTML='<button onclick="copyAiMsg(this)">📋 复制</button><button onclick="insertAiToTemplate(this)">📄 插入文档</button>';
    div.appendChild(actions);
  }

  body.appendChild(div);
  if(!noScroll)scrollAiChat();
  return div;
}

function formatAiContent(t){
  if(!t)return'';
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^/,'<p>').replace(/$/,'</p>');
}

function copyAiMsg(btn){
  var msgEl=btn.closest('.ai-msg');
  var textEl=msgEl.querySelector('.ai-msg-text');
  var text=textEl.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      btn.textContent='✅ 已复制';
      setTimeout(function(){btn.textContent='📋 复制';},2000);
    }).catch(function(){ fallbackCopy(text,btn); });
  } else { fallbackCopy(text,btn); }
}

function fallbackCopy(text,btn){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try { document.execCommand('copy');btn.textContent='✅ 已复制';
    setTimeout(function(){btn.textContent='📋 复制';},2000);
  } catch(e){ toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}

function insertAiToTemplate(btn){
  var msgEl=btn.closest('.ai-msg');
  var textEl=msgEl.querySelector('.ai-msg-text');
  var text=textEl.textContent;
  if(currentPage==='templateEditor'&&window._tplQuill){
    var range=window._tplQuill.getSelection();
    if(range){ window._tplQuill.insertText(range.index,text); }
    else { window._tplQuill.root.innerHTML+='<p>'+esc(text).replace(/\n/g,'<br>')+'</p>'; }
    toast('已插入到文档');
  } else {
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast('已复制到剪贴板，请打开模板编辑器粘贴');
      }).catch(function(){ toast('请先打开模板中心，新建或编辑一个模板'); });
    } else { toast('请先打开模板中心，新建或编辑一个模板'); }
  }
}

function showAiTyping(){
  var el=document.createElement('div');el.className='ai-typing';
  el.innerHTML='<span></span><span></span><span></span>';
  $('aiChatBody').appendChild(el);scrollAiChat();return el;
}

function removeAiTyping(el){
  if(el&&el.parentNode)el.parentNode.removeChild(el);
}

function scrollAiChat(){
  var body=$('aiChatBody');
  setTimeout(function(){body.scrollTop=body.scrollHeight;},50);
}

function clearAiChat(){
  if(_aiMessages.length&&!confirm('确定清空当前对话吗？'))return;
  _aiMessages=[];
  try { localStorage.removeItem(_AI_STORAGE_KEY); } catch(e){}
  // 恢复欢迎页
  $('aiChatBody').innerHTML='<div class="ai-welcome">'+
    '<div class="ai-welcome-icon">🤖</div>'+
    '<p>我是您的 AI 法律助手，可以帮您：</p>'+
    '<ul>'+
    '<li><b>起草文书</b> — 输入案情，自动生成起诉状/答辩状/代理词初稿</li>'+
    '<li><b>审查合同</b> — 粘贴条款，识别风险点并给出修改建议</li>'+
    '<li><b>法律检索</b> — 描述争议问题，梳理相关法条与裁判观点</li>'+
    '</ul></div>';
}

function aiInputKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();sendAiMessage();
  }
}

/* 自适应 textarea 高度 */
document.addEventListener('input',function(e){
  if(e.target.id==='aiInput'){
    e.target.style.height='auto';
    e.target.style.height=e.target.scrollHeight+'px';
  }
});

/* ---- URL → 页面解析（初始化 & popstate 共用） ---- */
function resolveUrlAndGo(){
  var p=window.location.pathname.replace(/^\//,'');
  if(p&&p.startsWith('local-cases/')){var lcid=parseInt(p.split('/')[1]);if(lcid){navToLocalCase(lcid);return}else{navTo('localCases');return}}
  if(p&&p.startsWith('cases/')){var cid=parseInt(p.split('/')[1]);if(cid){navToCase(cid);return}else{navTo('cases');return}}
  if(p&&p.startsWith('templates/editor')){
    var params=new URLSearchParams(window.location.search);
    var editId=params.get('edit');var newFlag=params.get('new');var draftId=params.get('draft');
    var tplId=params.get('t');var caseId=params.get('case');var newDocFlag=params.get('newdoc');
    if(draftId){editDraft(parseInt(draftId));return}
    if(editId){editTemplate(parseInt(editId));return}
    if(newDocFlag!==null){newDoc(caseId?parseInt(caseId):null);return}
    if(newFlag!==null){navToNewTemplate();return}
    if(tplId&&caseId){navToTemplateEditor(parseInt(tplId),parseInt(caseId));return}
    navTo('templateCenter');return;
  }
  if(p&&PT[p]){navTo(p);return}
  navTo('dashboard');
}

function tick(){var n=new Date();$('ttm').textContent=n.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' '+n.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
buildNav();
// 优先根据原始 URL 导航（支持刷新不回首页），否则走服务端渲染的默认页面
resolveUrlAndGo();
tick();setInterval(tick,30000);
setTimeout(checkPresAlertsOnLaunch,1000);
setTimeout(checkRetainerAlertsOnLaunch,1500);
setTimeout(restoreActiveTimer,500);
loadAiHistory();  // 恢复 AI 对话历史
initSearch();     // 全局搜索
document.addEventListener('keydown',function(e){if(e.key==='Escape')closemodal()});

// 浏览器前进/后退
window.addEventListener('popstate',resolveUrlAndGo);
