function loadDashboard(){
  apiFetch('/api/dashboard').then(function(d){
    // ===== 一、预警横幅 =====
    var warnings=d.warnings||[];
    var alertH='';
    if(warnings.length>0){
      // 最多显示 6 条，去重（同 case_id + type 只保留最紧急的）
      var seen={},uniqueW=[];
      warnings.forEach(function(w){
        var key=w.case_id+'_'+w.type;
        if(!seen[key]){seen[key]=true;uniqueW.push(w)}
      });
      uniqueW=uniqueW.slice(0,6);
      // 分类：urgent（0-7天）放前面，然后是 warning（8-30天）
      alertH='<div class="dash-alert-wrap" id="dashAlertWrap">';
      alertH+='<div class="daw-hd"><span class="daw-icon">⚠️</span><span class="daw-title">期限预警</span></div>';
      alertH+='<div class="dash-alert-scroll">';
      uniqueW.forEach(function(w){
        var cls=w.days_until<=7?'urgent':'warning';
        var dotCls=w.days_until<=7?'urg':'';
        var icon=w.type==='preservation'?'🔒':w.type==='hearing'?'⚖️':'⏰';
        var onclick=w.case_id?"onclick=\"navToCase("+w.case_id+")\"":"";
        alertH+='<div class="dash-alert-item '+cls+'" '+onclick+' title="'+esc(w.detail||'')+'">';
        if(dotCls)alertH+='<span class="dai-dot '+dotCls+'"></span>';
        alertH+=icon+' '+esc(w.label)+' '+esc(w.case_number||w.case_reason||'');
        alertH+='</div>';
      });
      alertH+='</div>';
      alertH+='<button class="dash-alert-dismiss" onclick="dismissDashAlerts()" title="关闭预警">✕</button>';
      alertH+='</div>';
    }
    if($('dashAlertBanner'))$('dashAlertBanner').innerHTML=alertH;

    // ===== 二、数字卡片 =====
    var s=d.stats||{};
    if($('dsActiveCases'))$('dsActiveCases').textContent=s.active_cases||0;
    if($('dsRetainer'))$('dsRetainer').textContent=s.retainer_clients||0;
    if($('dsHours'))$('dsHours').textContent=s.monthly_hours||0;
    if($('dsRevenue'))$('dsRevenue').textContent=fma(s.monthly_revenue||0);
    if($('dsPres'))$('dsPres').textContent=s.urgent_preservations||0;

    // ===== 三、今日待办 =====
    var todos=d.today_todos||[];
    var todoH='';
    if(todos.length===0){
      todoH='<div class="empty"><div class="eicon">☀️</div><p>今日无事，专注办案。</p></div>';
    }else{
      todos.forEach(function(t){
        var timeLabel=t.time?t.time:'全天';
        var typeIcon=t.source==='schedule'?(t.type==='hearing'?'⚖️':'📅'):'✅';
        var meta=[];
        if(t.case_number)meta.push(t.case_number);
        if(t.location)meta.push(t.location);
        todoH+='<div class="dash-todo-item" data-todo-source="'+t.source+'" data-todo-id="'+t.id+'">';
        todoH+='<div class="dti-chk" onclick="toggleDashTodo(this,\''+t.source+'\',\''+t.id+'\')">✓</div>';
        todoH+='<div class="dti-body"><div class="dti-title">'+typeIcon+' '+esc(t.title)+'</div>';
        if(meta.length>0)todoH+='<div class="dti-meta">'+esc(meta.join(' · '))+'</div>';
        todoH+='</div>';
        todoH+='<div class="dti-time">'+esc(timeLabel)+'</div>';
        todoH+='</div>';
      });
    }
    if($('dashTodos'))$('dashTodos').innerHTML=todoH;

    // ===== 四、在办案件概览 =====
    var stageDist=d.stage_distribution||[];
    var recentCases=d.recent_cases||[];
    var overviewH='';
    if(stageDist.length===0&&recentCases.length===0){
      overviewH='<div class="empty"><div class="eicon">📋</div><p>暂无在办案件</p></div>';
    }else{
      overviewH+='<div class="dash-chart-area">';
      // 环状图
      if(stageDist.length>0){
        overviewH+='<div class="dash-chart-canvas"><canvas id="dashDonutChart"></canvas></div>';
        overviewH+='<div class="dash-chart-legend">';
        var stageColors={接案:'#b09878',立案:'#5b6e7a',审理中:'#c4816b',判决:'#7a9a7e',执行:'#8c7a6b',暂缓:'#aaaaaa'};
        stageDist.forEach(function(sd){
          overviewH+='<div class="dcl-item" onclick="navTo(\'cases\')"><span class="dcl-dot" style="background:'+(stageColors[sd.stage]||'var(--primary)')+'"></span>'+esc(sd.stage)+'<span class="dcl-count">'+sd.count+'</span></div>';
        });
        overviewH+='</div>';
      }else{overviewH+='<div style="text-align:center;color:var(--tx3);flex:1">暂无阶段分布数据</div>';}
      overviewH+='</div>';
      // 最近案件列表
      if(recentCases.length>0){
        overviewH+='<div style="margin-top:12px;font-size:12px;color:var(--tx2);font-weight:600">最近更新</div>';
        recentCases.forEach(function(c){
          var stage=c.case_stage||'接案';
          overviewH+='<div class="dash-quick-item" onclick="navToCase('+c.id+')"><span class="dqi-icon">⚖️</span><span class="dqi-name">'+esc(c.case_number)+'</span><span class="tag tag-'+stage+'">'+stage+'</span></div>';
        });
      }
    }
    if($('dashCaseOverview'))$('dashCaseOverview').innerHTML=overviewH;

    // 绘制环状图
    if(stageDist.length>0){
      setTimeout(function(){
        var canvas=$('dashDonutChart');if(!canvas)return;
        var ctx=canvas.getContext('2d');
        var parent=canvas.parentElement;
        canvas.width=parent.clientWidth||140;
        canvas.height=parent.clientHeight||140;
        var cw=canvas.width,ch=canvas.height;
        var cx=cw/2,cy=ch/2,r=Math.min(cx,cy)-10;
        var total=0;stageDist.forEach(function(sd){total+=sd.count});
        var colors=[];
        stageDist.forEach(function(sd){
          var cmap={接案:'#b09878',立案:'#5b6e7a',审理中:'#c4816b',判决:'#7a9a7e',执行:'#8c7a6b',暂缓:'#aaaaaa'};
          colors.push(cmap[sd.stage]||'var(--primary)');
        });
        var startAngle=-Math.PI/2;
        for(var i=0;i<stageDist.length;i++){
          var sliceAngle=(stageDist[i].count/total)*Math.PI*2;
          ctx.beginPath();ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r,startAngle,startAngle+sliceAngle);
          ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();
          startAngle+=sliceAngle;
        }
        // 中心白色圆（环状效果）
        ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,Math.PI*2);
        ctx.fillStyle='#fafaf8';ctx.fill();
        // 中心数字
        ctx.fillStyle='#3a3a3a';ctx.font='bold 18px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(total,cx,cy);
        ctx.font='10px -apple-system,sans-serif';ctx.fillStyle='#8c8c8c';
        ctx.fillText('在办案件',cx,cy+16);
      },100);
    }

    // ===== 五、快捷入口 =====
    var docs=d.recent_docs||[];
    var docH='';
    if(docs.length===0)docH='<div class="empty"><p>暂无文档</p></div>';
    else{
      docs.forEach(function(dd){
        docH+='<div class="dash-quick-item" onclick="navTo(\'documents\')"><span class="dqi-icon">📄</span><span class="dqi-name">'+esc(dd.original_name||'未命名')+'</span><span class="dqi-meta">'+esc(dd.doc_category||'')+'</span></div>';
      });
    }
    if($('dashQuickDocs'))$('dashQuickDocs').innerHTML=docH;

    var rcases=d.recent_cases||[];
    var caseH='';
    if(rcases.length===0)caseH='<div class="empty"><p>暂无案件</p></div>';
    else{
      rcases.forEach(function(rc){
        var stage=rc.case_stage||'接案';
        caseH+='<div class="dash-quick-item" onclick="navToCase('+rc.id+')"><span class="dqi-icon">⚖️</span><span class="dqi-name">'+esc(rc.case_number)+'</span><span class="tag tag-'+stage+'">'+stage+'</span></div>';
      });
    }
    if($('dashQuickCases'))$('dashQuickCases').innerHTML=caseH;

  }).catch(function(e){
    // 接口失败时显示空状态
    if($('dashStats'))$('dashStats').innerHTML='<div style="text-align:center;color:var(--tx3);padding:20px">加载失败，请确保后端服务已启动</div>';
    console.error('Dashboard load error:',e);
  });
}

    var isDone=item.classList.contains('done');
    apiFetch('/api/lw/tasks',{method:'POST',body:JSON.stringify({id:parseInt(id),status:isDone?'completed':'pending'})}).catch(function(){});

}

function initCaseDropZone(){
  var el=$('caseDropZone');if(!el)return;
  el.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();el.classList.add('drag-over')});
  el.addEventListener('dragleave',function(){el.classList.remove('drag-over')});
  el.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();el.classList.remove('drag-over');handleCaseDropFiles(e.dataTransfer.files)});
}

function loadCases(){
  apiFetch('/api/cases?limit=200').then(function(res){
    var all=res.items||[];
    var s=($('cas_s')?$('cas_s').value:'').toLowerCase();
    var stageFilter=$('cas_st')?$('cas_st').value:'active';
    var sortBy=$('cas_sort')?$('cas_sort').value:'created';
    // 筛选
    if(s)all=all.filter(function(c){return(c.case_number+';'+c.case_reason+';'+c.court+';'+c.plaintiff+';'+c.defendant+';'+(c.clients||[]).map(function(x){return x.name}).join(';')).toLowerCase().indexOf(s)>-1});
    if(stageFilter==='active')all=all.filter(function(c){return isActiveCase(c)});
    else if(stageFilter==='closed')all=all.filter(function(c){return stageName(c.case_stage)==='结案'});
    // 排序
    if(sortBy==='trial')all.sort(function(a,b){return(b.trial_date||'').localeCompare(a.trial_date||'')});
    else if(sortBy==='updated')all.sort(function(a,b){return(b.updated_at||'').localeCompare(a.updated_at||'')});
    else if(sortBy==='acceptance')all.sort(function(a,b){return(b.acceptance_date||'').localeCompare(a.acceptance_date||'')});
    else all.sort(function(a,b){return(b.created_at||'').localeCompare(a.created_at||'')});

    var tp=Math.ceil(all.length/PSZ)||1;if(PG.cases>tp)PG.cases=tp;
    var st=(PG.cases-1)*PSZ,pg=all.slice(st,st+PSZ);

    var h='';
    if(pg.length===0)h='<div class="cas-empty"><div class="eicon">📁</div><h3>还没有案件记录</h3><p>点击下方按钮创建第一个案件，或上传起诉状/判决书自动提取信息</p><button class="btn btn-p" onclick="ocase()" style="margin-right:8px">＋ 新建案件</button><button class="btn btn-o" onclick="uploadCaseFile()">📤 上传文件创建</button></div>';
    else{
      h='<div class="case-grid">';
      pg.forEach(function(c){
        var stage=stageName(c.case_stage);
        var clientNames=(c.clients||[]).map(function(x){return x.name}).join('、')||c.plaintiff||c.defendant||'未关联客户';
        var nkd=nextKeyDate(c),nd=daysUntil(nkd);
        var cdHtml='';
        if(nd!==null&&nd<=3)cdHtml='<span class="cd-warn urgent">'+(nd<=0?'已逾期':'距开庭'+nd+'天')+'</span>';
        else if(nd!==null&&nd<=7)cdHtml='<span class="cd-warn near">距开庭'+nd+'天</span>';
        else if(nkd)cdHtml='<span style="font-size:11px;color:var(--tx3)">'+nkd.slice(0,10)+'</span>';
        h+='<div class="case-card" onclick="navToCase('+c.id+')">';
        h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px"><span class="cn">'+esc(c.case_number)+'</span><span class="cr">'+esc(c.case_reason||'未填写案由')+'</span></div>';
        h+='<div class="cm">👤 '+esc(clientNames)+' | '+esc(c.court||'未知法院')+'</div>';
        h+='<div class="cf"><div class="cs"><span class="dot"></span>'+stage+'</div>';
        if(cdHtml)h+=cdHtml;
        h+='<span class="ca">¥'+fma(c.amount_in_dispute)+'</span></div>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+=buildPager('cases',all.length,'loadCases()');
    if($('casesTable'))$('casesTable').innerHTML=h;
  }).catch(function(){
    if($('casesTable'))$('casesTable').innerHTML='<div class="empty"><p>加载失败，请确保后端服务已启动</p></div>';
  })
}

function ocase(id,prefill){
  apiFetch('/api/cases?limit=200').then(function(res){
    var cases=res.items||[],c=null;
    if(id)c=cases.find(function(x){return x.id===id});
    var pf=prefill||{};
    var cn=c?c.case_number:pf.case_number||'';
    var cr=c?c.case_reason:pf.case_reason||'';
    var ct=c?c.court:pf.court||'';
    var ju=c?c.judge:pf.judge||'';
    var pl=c?c.plaintiff:pf.plaintiff||'';
    var df=c?c.defendant:pf.defendant||'';
    var amt=c?c.amount_in_dispute:pf.amount_in_dispute||'';
    var stg=c?c.case_stage:pf.case_stage||'接案';
    var h='<form onsubmit="return false"><input type="hidden" id="cf_id" value="'+(c?c.id:'')+'"><div class="fgrid">';
    h+=inputFld('案号','caseNumber','text',cn,true);
    h+=inputFld('案由','caseReason','text',cr,true);
    h+=inputFld('受理法院','court','text',ct,true);
    h+='<div class="fg"><label>案件阶段</label><select id="cf_caseStage">';
    ['接案','立案','审理中','判决','执行','结案'].forEach(function(s){
      h+='<option value="'+s+'"'+(stg===s?' selected':'')+'>'+s+'</option>';
    });
    h+='</select></div>';
    h+=inputFld('承办法官','judge','text',ju);
    h+=inputFld('书记员','clerk','text',c?c.clerk:'');
    h+=autocompleteField('原告','plaintiff',pl);
    h+=autocompleteField('被告','defendant',df);
    h+=inputFld('标的额（万元）','amount','number',amt,'',{step:'0.01',min:'0'});
    h+=inputFld('收案日期','acceptanceDate','date',c?c.acceptance_date?c.acceptance_date.slice(0,10):'':'');
    h+=inputFld('开庭日期','trialDate','date',c?c.trial_date?c.trial_date.slice(0,10):'':'');
    h+='<div class="fg fw"><label>备注</label><textarea id="cf_notes" rows="2">'+(c?esc(c.notes||''):'')+'</textarea></div>';
    h+='</div></form>';
    fmodal(c?'编辑案件':'新增案件',h,function(){
      var data={
        case_number:$('cf_caseNumber').value.trim(),
        case_reason:$('cf_caseReason').value.trim(),
        court:$('cf_court').value.trim(),
        case_stage:$('cf_caseStage').value,
        judge:$('cf_judge').value.trim(),
        clerk:$('cf_clerk').value.trim(),
        plaintiff:$('cf_plaintiff').value.trim(),
        defendant:$('cf_defendant').value.trim(),
        amount_in_dispute:parseFloat($('cf_amount').value)||0,
        acceptance_date:$('cf_acceptanceDate').value||null,
        trial_date:$('cf_trialDate').value||null,
        notes:$('cf_notes').value.trim()
      };
      var method=c?'PUT':'POST',url='/api/cases/'+(c?c.id:'');
      if(!data.case_number){toast('请输入案号','err');return}
      if(!data.case_reason){toast('请输入案由','err');return}
      if(!data.court){toast('请输入受理法院','err');return}
      apiFetch(url,{method:method,body:JSON.stringify(data)}).then(function(){
        closemodal();loadCases();toast(c?'案件已更新 ✅':'案件已添加 ✅','ok')
      }).catch(function(e){toast('操作失败: '+(e.message||'未知错误'),'err')})
    });
    // 初始化原告/被告自动补全
    setTimeout(function(){initAutocomplete('plaintiff');initAutocomplete('defendant')},60)
  })
}

// 辅助：加载案件文档
function loadCaseDocs(caseId){
  apiFetch('/api/documents?case_id='+caseId+'&limit=50').then(function(res){
    var docs=Array.isArray(res)?res:(res.items||[]),h='';
    if(docs.length===0)h='<div style="color:var(--tx3);font-size:12px">暂无文档，点击"上传"添加</div>';
    else{
      h='<table><thead><tr><th>文件名</th><th>类型</th><th>日期</th><th>大小</th><th>操作</th></tr></thead><tbody>';
      docs.forEach(function(d){
        var size=d.file_size?fileSize(d.file_size):'—';
        var ft=(d.file_type||'').toLowerCase();
        var canPreview=isPreviewable(ft);
        var dlUrl=API+'/api/documents/'+d.id+'/download';
        var pvUrl=API+'/api/documents/'+d.id+'/preview';
        if(_TQ){dlUrl+='?'+_TQ;pvUrl+='?'+_TQ}
        var btns='<a href="'+dlUrl+'" class="btn btn-o btn-sm">⬇ 下载</a>';
        if(canPreview)btns+=' <a href="'+pvUrl+'" target="_blank" class="btn btn-o btn-sm">👁 预览</a>';
        if(d.is_draft||ft==='docx'||ft==='docm')btns+=' <button class="btn btn-o btn-sm" onclick="editDoc('+d.id+')">✏️ 编辑</button>';
        btns+=' <button class="btn btn-d btn-sm" onclick="ddoc('+d.id+')">🗑</button>';
        var isDraftOrEditable=d.is_draft||ft==='docx'||ft==='docm';
        var nameClick;
        if(isDraftOrEditable)nameClick='editDoc('+d.id+')';
        else if(canPreview)nameClick="window.open('"+pvUrl+"','_blank')";
        else nameClick="window.open('"+dlUrl+"','_blank')";
        h+='<tr><td>'+docIcon(d.file_type)+' <b style="cursor:pointer;color:var(--nv)" onclick="'+nameClick+'">'+esc(d.original_name||d.filename||'未命名')+'</b></td><td>'+catLabel(d.doc_category)+'</td><td>'+fmd((d.uploaded_at||d.created_at||'').slice(0,10))+'</td><td>'+size+'</td><td>'+btns+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    if($('caseDocList'))$('caseDocList').innerHTML=h;
  }).catch(function(){if($('caseDocList'))$('caseDocList').innerHTML='<div style="color:var(--tx3)">加载失败</div>'})
}
function filterCaseDocs(cat,caseId){/* TODO: filter docs by category */loadCaseDocs(caseId);}

// 辅助：加载案件待办
function loadCaseTodos(caseId,caseNumber){
  apiFetch('/api/lw/tasks?limit=50').then(function(tr){
    var tasks=(tr.items||[]).filter(function(t){return t.related&&t.related.indexOf(caseNumber)>-1});
    var th='';
    if(tasks.length===0)th='<div style="color:var(--tx3);font-size:12px">暂无待办</div>';
    else tasks.forEach(function(t){
      th+='<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px"><input type="checkbox" onchange="doneCaseTodo('+t.id+','+caseId+')" '+(t.status==='已完成'?'checked':'')+'><span style="'+(t.status==='已完成'?'text-decoration:line-through;color:var(--tx3)':'')+'">'+esc(t.title)+'</span></div>';
    });
    if($('caseTodos'))$('caseTodos').innerHTML=th;
  }).catch(function(){if($('caseTodos'))$('caseTodos').innerHTML='<div style="color:var(--tx3)">加载失败</div>'})
}
function doneCaseTodo(taskId,caseId){doneTask(taskId);setTimeout(function(){loadCaseTodos(caseId,_caseDetailData?esc(_caseDetailData.case_number):'')},500)}

// 辅助：工时汇总
function loadCaseBilling(caseId){
  apiFetch('/api/billing/time-records?case_id='+caseId+'&limit=500').then(function(res){
    var records=Array.isArray(res)?res:(res.items||[]);
    var totalMin=0;
    records.forEach(function(r){totalMin+=r.duration_minutes||0});
    var hours=(totalMin/60).toFixed(1);
    // Get billing rate
    var rate=_caseDetailData&&_caseDetailData.billing_rate?_caseDetailData.billing_rate:0;
    if(!rate){
      apiFetch('/api/billing/config').then(function(configs){
        var def=Array.isArray(configs)?configs.find(function(c){return c.is_default}):null;
        rate=def?def.unit_price:2000;
        updateBillingPanel(hours,rate);
      }).catch(function(){updateBillingPanel(hours,2000)})
    }else{updateBillingPanel(hours,rate)}
  }).catch(function(){})
}
function updateBillingPanel(hours,rate){
  var amt=(parseFloat(hours)*rate).toFixed(2);
  var card=document.querySelector('#casDetailArea .pnl:nth-child(8) .pnl-bd');//工时费用 card
  if(card){
    card.innerHTML='<div style="font-size:13px;color:var(--tx2);line-height:1.8"><div>本案累计工时：<b style="color:var(--accent)">'+hours+' 小时</b></div><div>本案累计费用：<b style="color:var(--accent)">¥'+fma(parseFloat(amt))+'</b></div></div><button class="btn btn-o btn-sm" style="margin-top:8px" onclick="navTo(\'billing\')">查看完整工时 →</button>';
  }
}

// 辅助：本地相似案件
function loadCaseSchedules(caseId){
  apiFetch('/api/schedules?case_id='+caseId+'&limit=20').then(function(res){
    var scheds=Array.isArray(res)?res:(res.items||[]);
    if(scheds.length===0)return;
    // Find key dates panel and append schedules
    var kdPanels=document.querySelectorAll('#casDetailArea .pnl');
    kdPanels.forEach(function(pnl){
      var hd=pnl.querySelector('.pnl-hd');
      if(hd&&hd.textContent.indexOf('关键日期')>=0){
        var bd=pnl.querySelector('.pnl-bd');
        if(!bd)return;
        var h='';
        scheds.forEach(function(s){
          var sd=s.start_time?s.start_time.slice(0,10):'';
          var nd=daysUntil(sd),cls='',label='';
          if(nd!==null&&nd<0){cls='overdue';label='已过期'}
          else if(nd!==null&&nd<=3){cls='urgent';label=nd+'天'}
          else if(nd!==null&&nd<=7){cls='near';label=nd+'天'}
          else{label=nd!==null?nd+'天':''}
          h+='<div class="key-date" style="cursor:pointer" onclick="osched('+s.id+')"><span class="kd-name">📅 '+esc(s.title||s.schedule_type)+'</span><span style="font-size:11px">'+sd+'</span><span class="kd-count '+cls+'">'+label+'</span></div>';
        });
        if(bd.innerHTML.indexOf('暂无')>=0)bd.innerHTML=h;
        else bd.innerHTML+=h;
      }
    });
  }).catch(function(){})
}

        });

}

    var h='';

      h='<div style="color:var(--tx3);font-size:12px">暂无本地区相同案由的本地判例。<br>建议将当前案件归档到本地判例库，方便后续同类案件参考。</div>';

// 辅助：上传文档到案件
function uploadToCase(caseId){
  var inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.docx,.doc,.png,.jpg,.jpeg';inp.multiple=true;
  inp.onchange=function(){
    if(!inp.files||inp.files.length===0)return;
    var done=0,total=inp.files.length;
    for(var i=0;i<inp.files.length;i++){
      var fd=new FormData();fd.append('file',inp.files[i]);fd.append('case_id',caseId);
      apiUpload('/api/documents/upload',fd).then(function(){done++;if(done>=total){loadCaseDocs(caseId);toast('已上传 '+total+' 个文件 ✅','ok')}}).catch(function(e){done++;if(done>=total)loadCaseDocs(caseId);toast('上传失败: '+(e.message||''),'err')});
    }
  };inp.click();
}

function showParseOverlay(msg){

  // 添加 body 遮罩
  var d=document.createElement('div');d.id='parseOverlayWrap';d.innerHTML=ol;
  document.body.appendChild(d);
}
function updateParseOverlay(msg){var el=$('parseOverlayMsg');if(el)el.textContent=msg}
function hideParseOverlay(){var el=$('parseOverlayWrap');if(el)el.remove()}

function handleCaseDropFiles(files){
  if(!files||files.length===0)return;
  // 校验
  var validFiles=[];var allowedExts=['.pdf','.docx','.txt','.png','.jpg','.jpeg'];
  for(var i=0;i<files.length;i++){
    var f=files[i],ext='.'+f.name.split('.').pop().toLowerCase();
    if(f.size>20*1024*1024){toast('文件「'+f.name+'」超过20MB，已跳过','err');continue}
    if(allowedExts.indexOf(ext)===-1){toast('不支持的文件类型「'+f.name+'」','err');continue}
    validFiles.push(f);
  }
  if(validFiles.length===0)return;

  showParseOverlay('正在上传并提取文字... ('+validFiles.length+' 个文件)');

  var fd=new FormData();
  for(var i=0;i<validFiles.length;i++)fd.append('files',validFiles[i]);

  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/cases/parse' + (_TQ?'?token='+_TOKEN.split('=')[1]:''),true);
  xhr.upload.onprogress=function(e){
    if(e.lengthComputable){
      var pct=Math.round(e.loaded/e.total*100);
      updateParseOverlay('正在上传... '+pct+'% ('+validFiles.length+' 个文件)');
    }
  };
  xhr.onload=function(){
    hideParseOverlay();
    if(xhr.status===200||xhr.status===201){
      try{
        var r=JSON.parse(xhr.responseText);
        _parseResult=r;
        if(!r.success){toast('⚠️ 文书解析未提取到信息，请手动创建','err');ocase();return}
        if(r.method==='ai')toast('✅ AI解析完成！请核对识别结果','ok');
        else if(r.method==='regex')toast('⚠️ AI不可用，已用基础规则提取，请仔细核对','err');
        navTo('caseParseConfirm');
      }catch(e){toast('解析结果异常，请手动创建','err');ocase()}
    }else{
      var errMsg='上传失败';
      try{var er=JSON.parse(xhr.responseText);errMsg=er.detail||errMsg}catch(e){}
      toast(errMsg,'err');ocase();
    }
  };
  xhr.onerror=function(){hideParseOverlay();toast('网络错误，请手动创建','err');ocase()};
  xhr.send(fd);
}

function extractAndCreate(text){
  // AI不可用时的回退：用正则提取然后走确认页
  if(text){
    var fields={};
    // 简单正则提取（模拟后端 regex fallback）
    var m;
    m=text.match(/[(（]?\s*(\d{4})\s*[）)]?\s*[一-龥]{0,3}[一-龥]{1,4}\S{0,4}\d+\s*号/);
    if(m)fields.case_number={value:m[0].trim(),confidence:0.7};
    m=text.match(/案由[：:]\s*(.+?)(?:\n|。|$)/);
    if(m)fields.case_reason={value:m[1].trim(),confidence:0.6};
    m=text.match(/原告[：:]\s*(.+?)(?:，|。|\n|$)/);
    if(m)fields.plaintiff={value:m[1].trim(),confidence:0.6};
    m=text.match(/被告[：:]\s*(.+?)(?:，|。|\n|$)/);
    if(m)fields.defendant={value:m[1].trim(),confidence:0.6};
    m=text.match(/(?:受理法院|法院)[：:]\s*(.+?)(?:，|。|\n|$)/);
    if(m)fields.court={value:m[1].trim(),confidence:0.6};
    m=text.match(/(?:承办法官|法官)[：:]\s*(.+?)(?:，|。|\n|$)/);
    if(m)fields.judge={value:m[1].trim(),confidence:0.5};
    _parseResult={success:true,method:'regex',document_type:'other',source_files:['前端提取'],source_text_preview:text.slice(0,500),fields:fields,duplicate_case:null,matched_clients:{plaintiff:null,defendant:null},warnings:['AI不可用，已用基础规则提取']};
    navTo('caseParseConfirm');
  }else{ocase()}
}

function doCreateCase(data){
  var btn=$('btnCreateCase');if(btn){btn.disabled=true;btn.textContent='正在创建...'}

  apiFetch('/api/cases/',{method:'POST',body:JSON.stringify(data)}).then(function(cr){
    var newCaseId=cr.id;
    toast('案件已创建 ✅','ok');

    // 将源文件关联为新案件的文档
    var r=_parseResult;
    if(r&&r.saved_file_paths&&r.saved_file_paths.length>0){
      var done=0,total=r.saved_file_paths.length;
      var srcFiles=r.source_files||[];
      r.saved_file_paths.forEach(function(fp,idx){
        // 为每个源文件创建 Document 记录
        var docData={
          original_name:srcFiles[idx]||'法律文书',
          doc_category:'其他',
          case_id:newCaseId,
          notes:'AI解析结果：'+(r.method==='ai'?'智能识别':'基础提取')+' | '+(r.document_type||'other')
        };
        apiFetch('/api/documents/',{method:'POST',body:JSON.stringify(docData)}).then(function(){
          done++;if(done>=total){_parseResult=null;navToCase(newCaseId)}
        }).catch(function(){done++;if(done>=total){_parseResult=null;navToCase(newCaseId)}});
      });
    }else{

      navToCase(newCaseId);

function overwriteCase(oldId){
  // 删除旧案件 → 创建新案件
  apiFetch('/api/cases/'+oldId,{method:'DELETE'}).then(function(){
    toast('旧案件已删除，正在创建新案件...','ok');
    var data=buildCreateData();
    doCreateCase(data);
  }).catch(function(e){toast('删除失败: '+(e.message||''),'err')})
}

function mergeToCase(oldId){
  // 用新识别的字段覆盖旧案件的空字段
  apiFetch('/api/cases/'+oldId).then(function(old){
    var r=_parseResult;var f=r.fields||{};
    var data={
      case_number:old.case_number,
      case_reason:old.case_reason||gv('case_reason'),
      court:old.court||gv('court'),
      judge:old.judge||gv('judge'),
      clerk:old.clerk||gv('clerk'),
      plaintiff:old.plaintiff||gv('plaintiff'),
      defendant:old.defendant||gv('defendant'),
      amount_in_dispute:old.amount_in_dispute||parseFloat(gv('amount_in_dispute'))||0,
      case_stage:old.case_stage||gv('case_stage','接案'),
      trial_date:old.trial_date?old.trial_date.slice(0,10):gv('trial_date'),
      notes:(old.notes||'')+'\\n[AI补充]'+gv('notes')
    };
    _parseResult=null;
    apiFetch('/api/cases/'+oldId,{method:'PUT',body:JSON.stringify(data)}).then(function(){
      toast('已合并到已有案件 ✅','ok');
      navToCase(oldId);
    }).catch(function(e){toast('合并失败: '+(e.message||''),'err')})
  }).catch(function(e){toast('获取旧案件失败','err')})
}

function gv(key,def){var r=_parseResult;if(!r||!r.fields)return def||'';var fd=r.fields[key];return fd&&fd.value?fd.value:(def||'')}

/* ---- 冲突检测 ---- */
var _conflictTimer=null;
function checkConflict(name,excludeId){
  if(!name||name.trim().length<2){var eb=$('cf_conflictBox');if(eb)eb.innerHTML='';return}
  clearTimeout(_conflictTimer);
  _conflictTimer=setTimeout(function(){
    apiFetch('/api/clients/check-conflict?name='+encodeURIComponent(name)+'&exclude_id='+(excludeId||0)).then(function(res){
      var conflicts=res.conflicts||[];
      var eb=$('cf_conflictBox');
      if(!eb)return;
      if(conflicts.length===0){eb.innerHTML='<div class="conf-ok">✅ 未发现利益冲突</div>';return}
      var h='<div class="conflict-alert"><div class="cf-title">⚠️ 发现潜在利益冲突</div>';
      conflicts.forEach(function(f){
        h+='<div class="cf-row"><span>'+esc(f.matched_name)+'（'+f.source+'）</span><span style="color:var(--warn);font-weight:600">相似度 '+f.similarity+'%</span></div>';
      });
      h+='</div>';
      eb.innerHTML=h;
    }).catch(function(){})
  },300)
}

/* ---- 文档管理（增强版） ---- */
var CAT_MAP={'legal_opinion':'法律意见书','contract_draft':'合同草稿','complaint':'起诉状','defense':'答辩状','proxy_statement':'代理词','evidence_list':'证据清单','retainer_service':'常法顾问','other':'其他'};
function catLabel(v){return CAT_MAP[v]||v||'其他'}
function fileSize(b){if(!b)return'0 B';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}

var _docFilters={case_id:'',client_id:'',category:''};
var _docCache={};  // 缓存文档数据供卡片事件使用

function docIcon(ft){
  if(!ft)return '📄';
  var t=ft.toLowerCase();
  if(t==='pdf')return '📕';
  if(t==='docx'||t==='doc')return '📝';
  if(t==='jpg'||t==='jpeg'||t==='png'||t==='gif'||t==='bmp'||t==='webp')return '🖼';
  return '📎'
}

function isPreviewable(ft){
  var t=(ft||'').toLowerCase();
  return t==='pdf'||t==='jpg'||t==='jpeg'||t==='png'||t==='gif'||t==='bmp'||t==='webp'||t==='doc';
}

function rdocs(){
  var h='<div class="doc-wrap">';
  // 左侧筛选
  h+='<div class="doc-filter"><h4>🔍 筛选</h4>';
  h+='<label style="font-size:11px;color:var(--tx3)">关联案件</label><select id="doc_case" onchange="_docFilters.case_id=this.value;loadDocs()"><option value="">全部案件</option></select>';
  h+='<label style="font-size:11px;color:var(--tx3)">关联客户</label><select id="doc_client" onchange="_docFilters.client_id=this.value;loadDocs()"><option value="">全部客户</option></select>';

  h+='</div>';

function loadDocFilters(){

  apiFetch('/api/clients?limit=200').then(function(res){var clients=Array.isArray(res)?res:(res.items||[]);var h='<option value="">全部客户</option>';clients.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.name)+'</option>'});if($('doc_client')){$('doc_client').innerHTML=h;$('doc_client').value=_docFilters.client_id}}).catch(function(){});
  apiFetch('/api/documents/categories').then(function(cats){var h='';if(Array.isArray(cats)){cats.forEach(function(c){var v=typeof c==='string'?c:c.value;var l=typeof c==='string'?catLabel(c):c.label;h+='<span class="doc-type-tag" onclick="_docFilters.category=\''+v+'\';loadDocs();refreshTypeTags()">'+l+'</span>'})}if($('docTypeTags'))$('docTypeTags').innerHTML='<span class="doc-type-tag'+(!_docFilters.category?' on':'')+'" onclick="_docFilters.category=\'\';loadDocs();refreshTypeTags()">全部</span>'+h}).catch(function(){})

function refreshTypeTags(){
  var tags=document.querySelectorAll('.doc-type-tag');
  tags.forEach(function(t){t.classList.remove('on')});
  if(!_docFilters.category){if(tags[0])tags[0].classList.add('on')}else{
    tags.forEach(function(t){if(t.textContent===catLabel(_docFilters.category))t.classList.add('on')})
  }
}

function loadDocs(){
  var params='limit=200';
  if(_docFilters.case_id)params+='&case_id='+_docFilters.case_id;
  if(_docFilters.client_id)params+='&client_id='+_docFilters.client_id;
  if(_docFilters.category)params+='&category='+_docFilters.category;
  apiFetch('/api/documents?'+params).then(function(res){
    var all=Array.isArray(res)?res:(res.items||[]);
    var s=($('doc_s')?$('doc_s').value:'').toLowerCase();
    if(s)all=all.filter(function(d){return(d.original_name||d.filename||'').toLowerCase().indexOf(s)>-1});
    all.sort(function(a,b){return(b.uploaded_at||'').localeCompare(a.uploaded_at||'')});
    // 缓存
    _docCache={};all.forEach(function(d){_docCache[d.id]=d});
    var tp=Math.ceil(all.length/PSZ)||1;if(PG.documents>tp)PG.documents=tp;
    var st=(PG.documents-1)*PSZ,pg=all.slice(st,st+PSZ);

    var h='';
    if(pg.length===0)h='<div class="empty" style="padding:30px"><div class="eicon">📂</div><p>暂无文档记录</p><p style="font-size:12px;color:var(--tx3)">点击上传按钮或拖拽文件到此页面上传</p></div>';
    else{
      pg.forEach(function(d){
        var draftTag=d.is_draft?' <span class="dc-badge" style="background:#faf5ef;color:var(--accent)">草稿</span>':'';
        var dateStr=d.uploaded_at?d.uploaded_at.slice(0,10):'';
        h+='<div class="doc-card">';
        h+='<div class="dc-icon">'+docIcon(d.file_type)+'</div>';
        h+='<div class="dc-info">';
        h+='<div class="dc-name"><a href="javascript:void(0)" onclick="docCardAction(\'open\','+d.id+')">'+esc(d.original_name||d.filename||'未命名')+'</a>'+draftTag+'</div>';
        h+='<div class="dc-meta">';
        h+='<span class="dc-badge">'+catLabel(d.doc_category)+'</span>';
        if(d.case_number)h+='<span>📋 <a href="javascript:void(0)" onclick="navToCase('+d.case_id+')" style="color:var(--nv);text-decoration:none">'+esc(d.case_number)+'</a></span>';
        if(d.client_name)h+='<span>👤 '+esc(d.client_name)+'</span>';
        h+='<span>📅 '+fmd(dateStr)+'</span>';
        h+='<span>📦 '+fileSize(d.file_size)+'</span>';
        h+='</div></div>';
        h+='<div class="dc-acts">';
        if(d.is_draft)h+='<button class="btn btn-o btn-sm" onclick="editDraft('+d.id+')">✏️ 编辑</button>';
        else {
          h+='<button class="btn btn-o btn-sm" onclick="docCardAction(\'download\','+d.id+')">📥 下载</button>';
          var ft2=(d.file_type||'').toLowerCase();
          if(isPreviewable(ft2))h+='<button class="btn btn-o btn-sm" onclick="docCardAction(\'open\','+d.id+')">👁 预览</button>';
          if(ft2==='docx'||ft2==='docm')h+='<button class="btn btn-o btn-sm" onclick="editDoc('+d.id+')">✏️ 在线编辑</button>';
        }
        h+='<button class="btn btn-o btn-sm" onclick="odoc('+d.id+')">📝 信息</button>';
        h+='<button class="btn btn-d btn-sm" onclick="ddoc('+d.id+')">🗑 删除</button>';
        h+='</div></div>';
      });
    }
    h+=buildPager('documents',all.length,'loadDocs()');
    if($('docCards'))$('docCards').innerHTML=h;
  }).catch(function(e){console.error('加载文档失败:',e);if($('docCards'))$('docCards').innerHTML='<div class="empty"><p>加载文档失败</p></div>'})
}

// 文档卡片操作 —— 统一下载/打开入口
function docCardAction(action,id){
  var d=_docCache[id];if(!d)return;
  if(action==='download'){
    var url=API+'/api/documents/'+id+'/download';
    if(_TQ)url+='?'+_TQ;
    window.open(url,'_blank')
  }
  if(action==='open'){
    // 草稿 → 打开编辑器；已上传 Word → 打开编辑器；PDF → 浏览器预览；其他 → 下载
    var ft=(d.file_type||'').toLowerCase();
    if(d.is_draft||ft==='docx'||ft==='docm'){editDoc(id)}
    else if(isPreviewable(ft)){
      var pvUrl=API+'/api/documents/'+id+'/preview';
      if(_TQ)pvUrl+='?'+_TQ;
      window.open(pvUrl,'_blank')
    }
    else {
      var dlUrl=API+'/api/documents/'+id+'/download';
      if(_TQ)dlUrl+='?'+_TQ;
      window.open(dlUrl,'_blank')
    }
  }
}

/* ---- 文件上传处理 ---- */
var _uploadResults=[];  // 暂存本次上传的OCR结果
function uploadFiles(files){
  var validFiles=[];
  var allowedExts=['.png','.jpg','.jpeg','.bmp','.tiff','.tif','.gif','.webp','.pdf','.docx'];
  for(var i=0;i<files.length;i++){
    var f=files[i],ext='.'+f.name.split('.').pop().toLowerCase();
    if(f.size>50*1024*1024){toast('文件「'+f.name+'」超过50MB，已跳过','err');continue}
    if(allowedExts.indexOf(ext)===-1){toast('不支持的文件类型「'+f.name+'」','err');continue}
    validFiles.push(f);
  }
  if(validFiles.length===0)return;

  var progress=$('upProgress'),statusEl=$('upStatus'),bar=$('upBar');
  if(progress)progress.style.display='block';
  if(statusEl){statusEl.style.display='block';statusEl.textContent='正在上传并识别...'}

  _uploadResults=[];
  var processed=0,successes=0;
  function uploadNext(idx){
    if(idx>=validFiles.length){
      if(statusEl)statusEl.textContent='完成！成功 '+successes+'/'+validFiles.length+' 个文件';
      setTimeout(function(){
        if(progress)progress.style.display='none';
        if(statusEl)statusEl.style.display='none';
      },2000);
      // OCR完成后 → 弹窗选择案件归档
      if(_uploadResults.length>0)linkUploadToCase();
      else loadDocs();
      return;
    }
    var f=validFiles[idx],fd=new FormData();
    fd.append('file',f);
    if(bar)bar.style.width=Math.round((idx/validFiles.length)*100)+'%';
    apiUpload('/api/dockets/upload',fd).then(function(r){
      successes++;
      _uploadResults.push(r);
      if(statusEl)statusEl.textContent='已识别：'+f.name+' ✅ ('+(idx+1)+'/'+validFiles.length+')';
      toast('「'+f.name+'」识别成功 ✅','ok');
      uploadNext(idx+1);
    }).catch(function(e){
      toast('「'+f.name+'」识别失败 ❌','err');
      uploadNext(idx+1);
    });
  }
  uploadNext(0);
}

function getTypeCls(t){

function getTypeLabel(t){

}

function buildMiniCal(){
  var today=new Date().toISOString().slice(0,10);
  var fd=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate();
  var h='<div class="cal-wrap"><div class="mini-cal">';
  h+='<div class="cal-mh"><button class="btn btn-o btn-sm" onclick="var nm=calMonth-1,ny=calYear;if(nm<0){nm=11;ny--}calMonth=nm;calYear=ny;loadCal()">◀</button><span>'+calYear+'年'+(calMonth+1)+'月</span><button class="btn btn-o btn-sm" onclick="var nm=calMonth+1,ny=calYear;if(nm>11){nm=0;ny++}calMonth=nm;calYear=ny;loadCal()">▶</button></div>';
  h+='<div class="cal-mg"><div class="cdh">日</div><div class="cdh">一</div><div class="cdh">二</div><div class="cdh">三</div><div class="cdh">四</div><div class="cdh">五</div><div class="cdh">六</div>';
  for(var i=0;i<fd;i++)h+='<div class="cd om"></div>';
  for(var d=1;d<=dim;d++){
    var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='cd';if(ds===today)cls+=' tdy';if(ds===_selDate)cls+=' sel';
    var dayEvts=_schedCache.filter(function(s){
      var sd=s.start_time?s.start_time.slice(0,10):'';
      var ed=s.end_time?s.end_time.slice(0,10):'';
      return sd<=ds&&ed>=ds;
    });
    var dots='';var typesSeen={};
    dayEvts.forEach(function(s){
      var tc=getTypeCls(s.schedule_type);
      if(!typesSeen[tc]){typesSeen[tc]=true;dots+='<span class="cal-dot '+tc+'"></span>'}
    });
    h+='<div class="'+cls+'" data-date="'+ds+'"><div class="dn">'+d+'</div><div class="cal-dots">'+dots+'</div></div>';
  }
  h+='</div></div><div class="evt-list" id="evtList">'+( _selDate?buildEvtListContent(_selDate):'<div class="evt-empty"><p>👆 点击左侧日期查看日程详情</p></div>')+'</div></div>';
  $('calArea').innerHTML=h;
  setupCalDelegation();
}

function buildEvtListContent(ds){
  var evts=_schedCache.filter(function(s){
    var sd=s.start_time?s.start_time.slice(0,10):'';
    var ed=s.end_time?s.end_time.slice(0,10):'';
    return sd<=ds&&ed>=ds;
  }).sort(function(a,b){return (a.is_all_day?-1:0)-(b.is_all_day?-1:0)||(a.start_time||'').localeCompare(b.start_time||'')});
  var h='<div class="evt-day-hd"><span>📅 '+ds+'</span><span style="font-size:12px;color:var(--tx3)">'+evts.length+' 个日程</span></div>';
  if(evts.length===0)h+='<div class="evt-empty"><p>该日暂无日程安排</p></div>';
  evts.forEach(function(s){
    var tc=getTypeCls(s.schedule_type);
    var timeStr=s.is_all_day?'全天':(s.start_time?s.start_time.slice(11,16):'');
    var endStr=s.is_all_day?'':(s.end_time?' - '+s.end_time.slice(11,16):'');
    var caseLink=s.case_number&&s.case_id?'<span style="cursor:pointer;color:var(--nv);font-size:11px" onclick="event.stopPropagation();navTo(\'caseDetail\');setTimeout(function(){casDetail('+s.case_id+')},200)">📋 '+esc(s.case_number)+'</span>':'';
    var reminderMap={none:'',day0:'开庭当天提醒',d1:'提前1天提醒',d3:'提前3天提醒',d7:'提前7天提醒'};
    var reminderTxt=s.reminder_setting&&s.reminder_setting!=='none'?reminderMap[s.reminder_setting]||s.reminder_setting:'';
    var reminderHtml=reminderTxt?'<span style="font-size:10px;color:var(--gn)">🔔 '+esc(reminderTxt)+'</span>':'';
    var notesHtml=s.notes?'<div style="font-size:11px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((s.notes||'').substring(0,40))+'</div>':'';
    h+='<div class="evt-card '+tc+'" onclick="osched('+s.id+')"><div class="evt-time">'+timeStr+endStr+'</div><div class="evt-body"><div class="evt-title">'+esc(s.title)+' '+reminderHtml+'</div><div class="evt-meta">'+getTypeLabel(s.schedule_type)+(s.location?' · '+esc(s.location):'')+(caseLink?' · '+caseLink:'')+'</div>'+notesHtml+'</div></div>';
  });
  return h;
}

function buildEvtList(ds){$('evtList').innerHTML=buildEvtListContent(ds)}

var _calDelegationReady=false;
function setupCalDelegation(){
  if(_calDelegationReady)return;
  var area=$('calArea');if(!area)return;
  // Mouseover delegation: detect hovering over date cells
  area.addEventListener('mouseover',function(e){
    var cell=e.target.closest('.cd[data-date]');
    if(!cell){hideCalHover();return}
    var ds=cell.getAttribute('data-date');
    if(!ds)return;
    calCellEnter(e,ds);
  });
  // Mouseout delegation: hide hover card when leaving date cells
  area.addEventListener('mouseout',function(e){
    var cell=e.target.closest('.cd[data-date]');
    if(!cell){hideCalHover();return}
    // Check if we moved to a related target outside any .cd cell or the hover card
    var rt=e.relatedTarget;
    if(rt&&rt.closest){
      if(rt.closest('.cd[data-date]'))return; // still within a date cell
      if(rt.closest('#calHoverCard'))return; // moving to the hover card
    }
    calCellLeave();
  });
  // Click delegation: select date when clicking a cell
  area.addEventListener('click',function(e){
    var cell=e.target.closest('.cd[data-date]');
    if(!cell)return;
    var ds=cell.getAttribute('data-date');
    if(!ds)return;
    _selDate=ds;
    selectCalDate(ds);
  });
  _calDelegationReady=true;
}

function selectCalDate(ds){
  _selDate=ds;
  // Update highlight
  var cells=document.querySelectorAll('.cal-mg .cd');
  cells.forEach(function(c){c.classList.remove('sel')});
  var target=document.querySelector('.cal-mg .cd[data-date="'+ds+'"]');
  if(target)target.classList.add('sel');
  // Update event list
  var el=$('evtList');if(el)el.innerHTML=buildEvtListContent(ds);
}
function initCalHover(){
  if(_hoverCardEl)return;
  _hoverCardEl=document.createElement('div');_hoverCardEl.className='cal-hover-card';_hoverCardEl.id='calHoverCard';
  _hoverCardEl.addEventListener('mouseenter',function(){clearTimeout(_hoverTimeout)});
  _hoverCardEl.addEventListener('mouseleave',function(){hideCalHover()});
  document.body.appendChild(_hoverCardEl);
}
function showCalHover(e,ds){
  initCalHover();
  var evts=_schedCache.filter(function(s){
    var sd=s.start_time?s.start_time.slice(0,10):'';
    var ed=s.end_time?s.end_time.slice(0,10):'';
    return sd<=ds&&ed>=ds;
  }).sort(function(a,b){return(a.is_all_day?-1:0)-(b.is_all_day?-1:0)||(a.start_time||'').localeCompare(b.start_time||'')});
  var h='';
  if(evts.length===0){
    h='<div class="ch-empty">当日无日程安排</div>';
  }else{
    var maxShow=3,extra=evts.length-maxShow;
    var shown=evts.slice(0,maxShow);
    shown.forEach(function(s){
      var tc=getTypeCls(s.schedule_type);
      var timeStr=s.is_all_day?'全天':(s.start_time?s.start_time.slice(11,16):'--:--');
      h+='<div class="ch-item"><span class="ch-dot '+tc+'"></span><span class="ch-title">'+esc(s.title)+'</span><span class="ch-time">'+timeStr+'</span></div>';
    });
    if(extra>0){
      h+='<div class="ch-scroll" style="display:none">';
      evts.forEach(function(s){
        var tc=getTypeCls(s.schedule_type);
        var timeStr=s.is_all_day?'全天':(s.start_time?s.start_time.slice(11,16):'--:--');
        h+='<div class="ch-item"><span class="ch-dot '+tc+'"></span><span class="ch-title">'+esc(s.title)+'</span><span class="ch-time">'+timeStr+'</span></div>';
      });
      h+='</div>';
      h+='<div class="ch-more" onmouseenter="expandCalHover()">+'+extra+' 项更多</div>';
    }
  }
  _hoverCardEl.innerHTML=h;
  // Position below the cell
  var cell=e.target.closest('.cd');
  if(!cell)cell=e.target;
  var rect=cell.getBoundingClientRect();
  var top=rect.bottom+2,left=rect.left;
  // Keep within viewport
  if(top+200>window.innerHeight)top=rect.top-200;
  if(left+220>window.innerWidth)left=Math.max(4,window.innerWidth-224);
  if(left<4)left=4;
  _hoverCardEl.style.top=top+'px';_hoverCardEl.style.left=left+'px';
  _hoverCardEl.classList.add('on');
}
function expandCalHover(){
  var scrollEl=_hoverCardEl.querySelector('.ch-scroll');
  if(scrollEl){
    scrollEl.style.display='block';
    scrollEl.style.maxHeight='300px';
    scrollEl.style.overflowY='auto';
  }
  var moreEl=_hoverCardEl.querySelector('.ch-more');
  if(moreEl)moreEl.style.display='none';
}
function hideCalHover(){
  clearTimeout(_hoverTimeout);
  if(_hoverCardEl)_hoverCardEl.classList.remove('on');
}
function calCellEnter(e,ds){
  clearTimeout(_hoverTimeout);
  _hoverTimeout=setTimeout(function(){showCalHover(e,ds)},250);
  // Also close expanded state
  if(_hoverCardEl){
    var scrollEl=_hoverCardEl.querySelector('.ch-scroll');
    if(scrollEl){scrollEl.style.display='none';scrollEl.style.maxHeight='';scrollEl.style.overflowY=''}
    var moreEl=_hoverCardEl.querySelector('.ch-more');
    if(moreEl)moreEl.style.display='';
  }
}
function calCellLeave(){clearTimeout(_hoverTimeout);hideCalHover()}

  }

  var timedEvts=_schedCache.filter(function(s){return !s.is_all_day&&s.start_time&&s.start_time.slice(0,10)===ds});
  if(timedEvts.length>0){
    timedEvts.sort(function(a,b){return(a.start_time||'').localeCompare(b.start_time||'')});
    var evtHtml='';
    timedEvts.forEach(function(s){
      var st=s.start_time.slice(11,16);
      var et=s.end_time?s.end_time.slice(11,16):st;
      var startMin=parseInt(st.slice(0,2))*60+parseInt(st.slice(3,5));
      var endMin=parseInt(et.slice(0,2))*60+parseInt(et.slice(3,5));
      if(endMin<=startMin)endMin=startMin+60;
      var topPct=Math.max(0,startMin-360)/1080*100;
      var hPct=Math.max(4,(endMin-startMin)/1080*100);
      var tc=getTypeCls(s.schedule_type);
      evtHtml+='<div class="day-evt '+tc+'" style="top:'+topPct+'%;height:'+hPct+'%" onclick="osched('+s.id+')"><div class="dv-t">'+esc(s.title)+'</div><div class="dv-m">'+getTypeLabel(s.schedule_type)+' '+st+'-'+et+(s.location?' | '+esc(s.location):'')+'</div></div>';

    }
  }
  $('calArea').innerHTML=h;
}

function parseSMS(text){
  var r={};var m;
  m=text.match(/\(?(\d{4})\)?\s*[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤川青藏琼宁]?\d{2,4}\s*[民刑行执]\S{2,5}\s*\d+号?/);
  if(m)r.caseNumber=m[0];
  m=text.match(/(\d{4}[-/年]\d{1,2}[-/月]\d{1,2})/);
  if(m)r.hearingDate=m[0].replace(/[年月]/g,'-').replace(/日/g,'');
  m=text.match(/(上午|下午)?\s*(\d{1,2})[时:：](\d{0,2})/);
  if(m)r.hearingTime=(m[1]||'')+(m[2]||'')+':'+(m[3]||'00');
  m=text.match(/(第?\d+法庭|第?\d+审判庭)/);
  if(m)r.location=m[0];
  m=text.match(/法官\s*([^\s,，。；;]+)/);
  if(m)r.judge=m[1];
  m=text.match(/电话\s*[：:]?\s*([\d\-]+)/);
  if(m)r.phone=m[1];
  return r
}

function previewBill(){
  var clientId=parseInt($('cf_clientId').value);
  if(!clientId){toast('请选择客户','err');return}
  var caseId=parseInt($('cf_caseId').value)||null;
  var startDate=$('cf_startDate').value,endDate=$('cf_endDate').value;
  if(!startDate||!endDate){toast('请选择日期范围','err');return}

  // 获取客户名
  apiFetch('/api/clients/'+clientId).then(function(client){
    // 加载该时段工时
    apiFetch('/api/billing/time-records?start_date='+startDate+'&end_date='+endDate+(caseId?'&case_id='+caseId:'')).then(function(res){
      var trs=Array.isArray(res)?res:(res.items||[]);
      var totalMin=0;
      trs.forEach(function(t){totalMin+=t.duration_minutes||0});

      // 获取费率
      var firmName=$('cf_firmName')?$('cf_firmName').value:'';
      var lawyerName=$('cf_lawyerName')?$('cf_lawyerName').value:'';
      var firmAddr=$('cf_firmAddr')?$('cf_firmAddr').value:'';
      var firmPhone=$('cf_firmPhone')?$('cf_firmPhone').value:'';
      var bankInfo=$('cf_bankInfo')?$('cf_bankInfo').value:'';

      // 默认费率
      apiFetch('/api/billing/config').then(function(configs){
        var rate=2000;
        if(configs&&configs.length>0){
          var def=configs.find(function(c){return c.is_default})||configs[0];
          rate=def.unit_price||2000;
        }
        var legalFee=Math.round(totalMin/60*rate*100)/100;
        var totalAmt=legalFee;

        var h='<h2>'+(firmName||'律师事务所')+'</h2>';
        h+='<div class="bp-sub">对 账 单</div>';
        h+='<div style="font-size:11px;color:#666"><b>客户：</b>'+esc(client.name)+'<br><b>期间：</b>'+startDate+' 至 '+endDate+'<br><b>费率：</b>'+rate+' 元/小时</div>';
        h+='<table><thead><tr><th>序号</th><th>服务内容</th><th>计费方式</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody>';
        h+='<tr><td>1</td><td>律师费（'+totalMin+'分钟）</td><td>按小时</td><td>'+(totalMin/60).toFixed(1)+'小时</td><td>'+rate+'元/小时</td><td style="text-align:right">'+fma(legalFee)+'</td></tr>';
        h+='</tbody></table>';
        h+='<div class="bp-total">合计：¥ '+fma(totalAmt)+'</div>';
        h+='<div class="bp-footer">'+(lawyerName?'承办律师：'+esc(lawyerName)+'<br>':'')+(firmAddr?'地址：'+esc(firmAddr)+'<br>':'')+(firmPhone?'电话：'+esc(firmPhone)+'<br>':'')+(bankInfo?'银行账户：'+esc(bankInfo):'')+'<br>制单日期：'+new Date().toISOString().slice(0,10)+'</div>';

        $('billPreview').innerHTML=h;
      }).catch(function(){
        $('billPreview').innerHTML='<div style="text-align:center;padding-top:40px;color:var(--tx3)">无法获取费率配置</div>';
      });
    }).catch(function(){$('billPreview').innerHTML='<div style="text-align:center;padding-top:40px;color:var(--tx3)">无工时记录</div>'})
  }).catch(function(){toast('客户不存在','err')})
}

function generateAndExportBill(){
  var clientId=parseInt($('cf_clientId').value);
  if(!clientId){toast('请选择客户','err');return}
  var caseId=parseInt($('cf_caseId').value)||null;
  var startDate=$('cf_startDate').value,endDate=$('cf_endDate').value;
  if(!startDate||!endDate){toast('请选择日期范围','err');return}

  var data={
    client_id:clientId,period_start:startDate,period_end:endDate,
    case_id:caseId,
    firm_name:$('cf_firmName')?$('cf_firmName').value:'',
    lawyer_name:$('cf_lawyerName')?$('cf_lawyerName').value:'',
    firm_address:$('cf_firmAddr')?$('cf_firmAddr').value:'',
    firm_phone:$('cf_firmPhone')?$('cf_firmPhone').value:'',
    bank_info:$('cf_bankInfo')?$('cf_bankInfo').value:''
  };

  apiFetch('/api/billing/bills/generate',{method:'POST',body:JSON.stringify(data)}).then(function(bill){
    toast('账单已生成! 正在下载PDF...','ok');
    // 下载 PDF
    var params='firm_name='+encodeURIComponent(data.firm_name)+'&lawyer_name='+encodeURIComponent(data.lawyer_name);
    params+='&firm_address='+encodeURIComponent(data.firm_address)+'&firm_phone='+encodeURIComponent(data.firm_phone);
    params+='&bank_info='+encodeURIComponent(data.bank_info);
    window.open('/api/billing/bills/'+bill.id+'/pdf?'+params,'_blank');
    // 刷新预览
    previewBill();
  }).catch(function(e){toast('生成失败: '+(e.message||''),'err')})
}

function drawRevenueChart(trendData){
  if(typeof Chart==='undefined'){
    // Chart.js 未加载时用纯CSS回退
    var el=$('revenueChart');if(!el)return;
    var maxVal=0;trendData.forEach(function(t){if(t.revenue>maxVal)maxVal=t.revenue});
    maxVal=Math.max(maxVal,1);
    var bars='';
    trendData.forEach(function(t,i){
      var hPct=t.revenue/maxVal*100,barColor=i===trendData.length-1?'var(--accent)':'var(--primary)';
      bars+='<div style="flex:1;text-align:center;font-size:11px"><div style="margin-bottom:2px;color:var(--tx3)">'+fma(t.revenue)+'</div><div style="height:'+hPct+'%;background:'+barColor+';border-radius:3px 3px 0 0;min-width:30px;margin:0 auto;max-width:50px"></div><div style="margin-top:4px">'+t.label+'</div></div>';
    });
    el.outerHTML='<div style="display:flex;align-items:flex-end;gap:8px;height:200px;padding:0 10px">'+bars+'</div>';
    return;
  }
  var ctx=$('revenueChart');if(!ctx)return;
  new Chart(ctx,{
    type:'bar',
    data:{
      labels:trendData.map(function(t){return t.label}),
      datasets:[
        {label:'创收',data:trendData.map(function(t){return t.revenue}),backgroundColor:'rgba(176,152,120,.7)',borderColor:'#b09878',borderWidth:1},
        {label:'回款',data:trendData.map(function(t){return t.paid}),backgroundColor:'rgba(91,110,122,.5)',borderColor:'#5b6e7a',borderWidth:1}
      ]
    },
    options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return v>=10000?(v/10000).toFixed(1)+'万':v}}}}}
  });
}

function startTimer(){
  apiFetch('/api/cases?limit=100').then(function(res){
    var cases=Array.isArray(res)?res:(res.items||[]);
    var opts=cases.map(function(c){return'<option value="'+c.id+'">'+esc(c.case_number)+'</option>'}).join('');
    var h='<div class="fg"><label>关联案件</label><select id="cf_caseId"><option value="">-- 选择案件 --</option>'+opts+'</select></div>';
    h+='<div class="fg"><label>工作分类</label><select id="cf_category"><option value="legal_research">法律研究</option><option value="drafting">文书起草</option><option value="hearing">庭审出庭</option><option value="consultation">客户咨询</option><option value="other">其他</option></select></div>';
    h+='<div class="fg fw"><label>工作内容</label><input type="text" id="cf_desc" placeholder="可选，描述当前工作"></div>';
    fmodal('▶ 开始计时',h,function(){
      var cid=parseInt($('cf_caseId').value)||null;timerCaseName='';
      if(cid){var ca=cases.find(function(x){return x.id===cid});if(ca)timerCaseName=ca.case_number}
      timerCategory=$('cf_category').value;
      apiFetch('/api/billing/time-records/start',{method:'POST',body:JSON.stringify({case_id:cid,work_category:timerCategory,description:$('cf_desc')?$('cf_desc').value:''})}).then(function(r){
        timerRecordId=r.id;timerSeconds=0;timerRunning=true;
        closemodal();render('billing');startTimerDisplay();toast('计时已开始 ⏱️','ok')
      }).catch(function(e){toast('启动失败: '+(e.message||''),'err')})
    })
  }).catch(function(){toast('无法获取案件列表','err')})
}

function stopTimer(){
  if(!timerRunning||!timerRecordId)return;timerRunning=false;if(timerInterval)clearInterval(timerInterval);
  var gb=$('gbTimer');if(gb)gb.style.display='none';
  apiFetch('/api/billing/time-records/'+timerRecordId+'/stop',{method:'POST'}).then(function(r){
    var min=r.duration_minutes||1;
    timerRecordId=null;timerCaseName='';render('billing');toast('已保存 '+min+' 分钟工时 ✅','ok')
  }).catch(function(){timerRecordId=null;render('billing');toast('停止失败','err')})
}

function restoreActiveTimer(){
  apiFetch('/api/billing/time-records/active').then(function(res){
    if(res.active&&res.record){
      timerRunning=true;timerRecordId=res.record.id;timerSeconds=res.elapsed_minutes*60;
      startTimerDisplay();
    }
  }).catch(function(){})
}

function rmsgs(){
  return'<div class="pnl"><div class="pnl-hd">💬 消息识别 <span style="font-weight:400;font-size:12px;color:var(--tx3)">（粘贴消息 → 自动识别 → 生成待办）</span></div><div class="pnl-bd">'+

function loadMsgData(){
  apiFetch('/api/lw/messages?limit=50').then(function(res){
    var msgs=res.items||[];var h='';
    if(msgs.length===0)h='<div class="empty"><p>暂无消息记录</p></div>';
    else{h='<table><thead><tr><th>时间</th><th>来源</th><th>消息内容</th><th>识别结果</th></tr></thead><tbody>';
      msgs.forEach(function(m){h+='<tr><td>'+fmd(m.time)+'</td><td>'+esc(m.source)+'</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.content)+'</td><td>'+esc(m.result)+'</td></tr>'});
      h+='</tbody></table>';}
    if($('msgHistory'))$('msgHistory').innerHTML=h;
  }).catch(function(){if($('msgHistory'))$('msgHistory').innerHTML='<div class="empty"><p>加载失败</p></div>'});
  apiFetch('/api/lw/tasks?limit=100').then(function(res){
    var tasks=res.items||[];var h='';
    if(tasks.length===0)h='<div class="empty"><p>暂无待办任务</p></div>';
    else{h='<table><thead><tr><th>优先级</th><th>任务</th><th>关联</th><th>截止日期</th><th>状态</th><th style="width:120px">操作</th></tr></thead><tbody>';
      tasks.sort(function(a,b){var p={高:0,中:1,低:2};return(p[a.priority]||1)-(p[b.priority]||1)});
      tasks.forEach(function(t){h+='<tr><td><span class="tag tag-'+t.priority+'">'+t.priority+'</span></td><td>'+esc(t.title)+'</td><td>'+esc(t.related||'-')+'</td><td>'+fmd(t.deadline)+'</td><td><span class="tag tag-'+(t.status==='已完成'?'已完成':'待处理')+'">'+t.status+'</span></td><td><button class="btn btn-s btn-sm" onclick="doneTask('+t.id+')">✅</button> <button class="btn btn-d btn-sm" onclick="delTask('+t.id+')">🗑</button></td></tr>'});
      h+='</tbody></table>';}
    if($('taskList'))$('taskList').innerHTML=h;
  }).catch(function(){if($('taskList'))$('taskList').innerHTML='<div class="empty"><p>加载失败</p></div>'})
}
function msgModal(){
  var h='<div class="fgrid"><div class="fg fw"><label>消息来源</label><select id="cf_source"><option>微信</option><option>企业微信</option><option>短信</option><option>邮件</option><option>其他</option></select></div>';
  h+='<div class="fg fw"><label>消息内容</label><textarea id="cf_content" rows="5" placeholder="粘贴或输入消息内容，例如：张总发来微信说他们公司有个劳动仲裁的案子，员工要求赔偿30万，问您能不能接？"></textarea></div>';
  h+='<div class="fg fw" id="msgParseR" style="display:none"><label>AI 识别结果（关键词匹配）</label><div style="background:var(--light);padding:12px;border-radius:6px;font-size:13px" id="msgParseC"></div></div></div>';
  fmodal('录入消息',h,function(){
    var content=$('cf_content').value.trim();if(!content){toast('请输入消息内容','err');return}
    var r=parseMessage(content),source=$('cf_source').value;
    apiFetch('/api/lw/messages/',{method:'POST',body:JSON.stringify({source:source,content:content,result:r.summary})}).then(function(){
      if(r.task){
        apiFetch('/api/lw/tasks/',{method:'POST',body:JSON.stringify({title:r.task,priority:r.priority,related:r.client||r.caseNum||'',deadline:r.deadline||'',status:'待处理'})}).then(function(){
          closemodal();loadMsgData();toast('消息已识别，已生成待办 ✅','ok')
        }).catch(function(){closemodal();loadMsgData()})
      }else{closemodal();loadMsgData();toast('消息已保存 ✅','ok')}
    }).catch(function(){toast('保存失败','err')})
  })
}
function parseMessage(text){
  var r={summary:'',task:'',priority:'中',client:'',caseNum:'',deadline:''};
  if(text.indexOf('劳动')>-1||text.indexOf('仲裁')>-1){r.summary='劳动争议相关事务';r.task='处理劳动仲裁案件咨询';r.priority='高'}
  else if(text.indexOf('合同')>-1||text.indexOf('协议')>-1){r.summary='合同/协议相关事务';r.task='起草/审查合同文件';r.priority='中'}
  else if(text.indexOf('开庭')>-1||text.indexOf('庭审')>-1||text.indexOf('法院')>-1){r.summary='庭审相关事务';r.task='准备开庭材料及出庭安排';r.priority='高'}
  else if(text.indexOf('债权')>-1||text.indexOf('借款')>-1||text.indexOf('欠款')>-1){r.summary='债权债务纠纷';r.task='处理债权纠纷案件';r.priority='中'}
  else if(text.indexOf('离婚')>-1||text.indexOf('婚姻')>-1){r.summary='婚姻家庭法律事务';r.task='处理婚姻家庭咨询';r.priority='中'}
  else if(text.indexOf('公司')>-1||text.indexOf('股权')>-1||text.indexOf('股东')>-1){r.summary='公司/股权法律事务';r.task='处理公司法律事务';r.priority='中'}
  else if(text.indexOf('工伤')>-1||text.indexOf('交通事故')>-1){r.summary='人身损害赔偿事务';r.task='处理人身损害赔偿案件';r.priority='高'}
  else if(text.indexOf('咨询')>-1||text.indexOf('请教')>-1){r.summary='客户一般咨询';r.task='回复客户法律咨询';r.priority='低'}
  else{r.summary='一般法律事务';r.task='跟进客户消息';r.priority='中'}
  var m=text.match(/[李王张陈刘杨赵黄周吴徐孙马胡朱郭何罗高林郑][某总律师经理老板女士先生]{1,2}/);if(m)r.client=m[0];
  m=text.match(/(\d+)\s*万/);if(m)r.summary+='，涉及金额约'+m[1]+'万元';
  m=text.match(/(\d{4}[-/年]\d{1,2}[-/月]\d{1,2})/);if(m)r.deadline=m[0].replace(/[年月]/g,'-').replace(/日/g,'');
  return r
}
function doneTask(id){apiFetch('/api/lw/tasks/'+id,{method:'PUT',body:JSON.stringify({status:'已完成'})}).then(function(){loadMsgData();toast('任务已完成 ✅','ok')}).catch(function(){toast('操作失败','err')})}
function delTask(id){confirmm('确认删除','确定删除该待办任务吗？',function(){apiFetch('/api/lw/tasks/'+id,{method:'DELETE'}).then(function(){loadMsgData();toast('已删除 ✅','ok')}).catch(function(){toast('删除失败','err')})})}

/* ---- 保全到期提醒 ---- */
var _presFilter='all',_presSelected=[];

function rpreservations(){
  var h='<div class="pnl"><div class="pnl-hd">🔒 保全到期提醒</div><div class="pnl-bd">';
  h+='<div class="pres-filter"><span class="on" onclick="_presFilter=\'all\';loadPresSummary()">全部</span><span onclick="_presFilter=\'expired\';loadPresSummary()">已过期</span><span onclick="_presFilter=\'7d\';loadPresSummary()">7天内到期</span><span onclick="_presFilter=\'30d\';loadPresSummary()">30天内到期</span><span onclick="_presFilter=\'90d\';loadPresSummary()">90天内到期</span></div>';
  h+='<div id="presSummaryTable">加载中...</div>';
  h+='<div id="presBatchBar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--divider);padding:10px 24px;z-index:100;display:flex;align-items:center;gap:12px"><span style="font-size:13px">已选 <b id="presSelCount">0</b> 条</span><button class="btn btn-o btn-sm" onclick="batchMarkProcessed()">标记已处理</button><button class="btn btn-o btn-sm" onclick="_presSelected=[];loadPresSummary()">取消选择</button></div>';
  h+='</div></div>';
  setTimeout(loadPresSummary,50);
  return h
}

function loadPresSummary(){
  apiFetch('/api/preservations?limit=200').then(function(res){
    var all=res.items||[],h='';
    if(_presFilter==='expired')all=all.filter(function(p){return p.days_until<0});
    else if(_presFilter==='7d')all=all.filter(function(p){return p.days_until>=0&&p.days_until<=7});
    else if(_presFilter==='30d')all=all.filter(function(p){return p.days_until>=0&&p.days_until<=30});
    else if(_presFilter==='90d')all=all.filter(function(p){return p.days_until>=0&&p.days_until<=90});
    all.sort(function(a,b){return a.days_until-b.days_until});

    // 更新筛选标签
    var fs=document.querySelectorAll('.pres-filter span');fs.forEach(function(s){s.classList.remove('on')});
    var activeFilter=document.querySelector('.pres-filter span.'+(_presFilter==='all'?'on':''))||fs[0];
    if(_presFilter==='all')fs[0].classList.add('on');
    else{var map={expired:1,'7d':2,'30d':3,'90d':4};var idx=map[_presFilter]||0;if(fs[idx])fs[idx].classList.add('on');}

    if(all.length===0)h='<div class="cas-empty"><div class="eicon">🎉</div><h3>暂无待续期的保全，干得漂亮！</h3></div>';
    else{
      h='<div class="tbl-wrap"><table><thead><tr><th style="width:30px"><input type="checkbox" onchange="toggleAllPres(this)" title="全选"></th><th>案件</th><th>保全类型</th><th>被保全标的</th><th>到期日期</th><th>倒计时</th><th>状态</th><th style="width:120px">操作</th></tr></thead><tbody>';
      all.forEach(function(p){
        var badgeCls='',badgeTxt='';
        var du=p.days_until;
        if(du<0){badgeCls='expired';badgeTxt='已过期'+Math.abs(du)+'天'}
        else if(du<=7){badgeCls='urgent';badgeTxt='还有'+du+'天到期'}
        else if(du<=30){badgeCls='warning';badgeTxt='还有'+du+'天到期'}
        else if(du<=90){badgeCls='info';badgeTxt='还有'+du+'天到期'}
        else{badgeCls='safe';badgeTxt=du+'天后到期'}
        h+='<tr><td><input type="checkbox" onchange="togglePresSel('+p.id+')" '+( _presSelected.indexOf(p.id)>-1?'checked':'')+'></td><td><b style="cursor:pointer;color:var(--nv)" onclick="navToCase('+p.case_id+')">'+esc(p.case_number||'案件#'+p.case_id)+'</b></td><td><span class="tag">'+esc(p.preservation_type)+'</span></td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(p.target)+'">'+esc(p.target)+'</td><td>'+fmd(p.end_date?p.end_date.slice(0,10):'')+'</td><td><span class="pres-badge '+badgeCls+'">'+badgeTxt+'</span></td><td>'+esc(p.status||'有效')+'</td><td><button class="btn btn-s btn-sm" onclick="renewPreservation('+p.id+')">🔄 续期</button> <button class="btn btn-o btn-sm" onclick="viewPreservation('+p.id+')">👁</button> <button class="btn btn-d btn-sm" onclick="delPreservation('+p.id+')">🗑</button></td></tr>';
      });
      h+='</tbody></table></div>';
      // 批量操作栏
      h+='<div style="margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3)">已选 <b id="presSelCount2">'+(_presSelected.length)+'</b> 条 | <button class="btn btn-o btn-sm" onclick="batchMarkProcessed()">✅ 批量标记已处理</button></div>';
    }
    if($('presSummaryTable'))$('presSummaryTable').innerHTML=h;
  }).catch(function(){if($('presSummaryTable'))$('presSummaryTable').innerHTML='<div class="empty"><p>加载失败</p></div>'})
}

function togglePresSel(id){var idx=_presSelected.indexOf(id);if(idx>-1)_presSelected.splice(idx,1);else _presSelected.push(id);loadPresSummary()}
function toggleAllPres(cb){var rows=document.querySelectorAll('#presSummaryTable input[type=checkbox]');rows.forEach(function(r,i){if(i>0){r.checked=cb.checked;var pid=parseInt(r.getAttribute('onchange').match(/\d+/));if(pid){var idx=_presSelected.indexOf(pid);if(cb.checked&&idx===-1)_presSelected.push(pid);else if(!cb.checked&&idx>-1)_presSelected.splice(idx,1)}}});loadPresSummary()}
function batchMarkProcessed(){
  if(_presSelected.length===0){toast('请先选择保全记录','err');return}
  confirmm('批量标记','确定将选中的 '+_presSelected.length+' 条保全标记为已处理吗？',function(){
    apiFetch('/api/preservations/batch/mark-processed',{method:'POST',body:JSON.stringify(_presSelected)}).then(function(){
      _presSelected=[];loadPresSummary();toast('已标记 ✅','ok')
    }).catch(function(){toast('操作失败','err')})
  })
}

/* 案件详情页 — 保全卡片 */
function loadPreservations(caseId){
  apiFetch('/api/preservations?case_id='+caseId+'&limit=50').then(function(res){
    var items=res.items||[],total=items.length;
    items.sort(function(a,b){return a.days_until-b.days_until});
    var h='';
    if(total===0)h='<div style="color:var(--tx3);font-size:12px;padding:8px 0">暂无保全记录</div>';
    else{
      items.forEach(function(p){
        var du=p.days_until,badgeCls='',badgeTxt='';
        if(du<0){badgeCls='expired';badgeTxt='已过期'+Math.abs(du)+'天'}
        else if(du<=7){badgeCls='urgent';badgeTxt='还有'+du+'天到期'}
        else if(du<=30){badgeCls='warning';badgeTxt='还有'+du+'天到期'}
        else if(du<=90){badgeCls='info';badgeTxt='还有'+du+'天到期'}
        else{badgeCls='safe';badgeTxt=du+'天后到期'}
        var dotCls='property';if(p.preservation_type.indexOf('证据')>-1)dotCls='evidence';else if(p.preservation_type.indexOf('行为')>-1)dotCls='behavior';
        h+='<div class="pres-item" onclick="viewPreservation('+p.id+')"><span class="pres-dot '+dotCls+'"></span><div class="pres-info"><div class="pi-target">'+esc(p.target)+'</div><div class="pi-number">'+esc(p.ruling_number||'无案号')+'</div></div><span class="pres-badge '+badgeCls+'">'+badgeTxt+'</span></div>';
      });
    }
    h+='<div style="margin-top:6px"><button class="btn btn-o btn-sm" onclick="addPreservation('+caseId+')">＋ 添加保全</button></div>';
    if($('presCard'))$('presCard').innerHTML=h;
  }).catch(function(){if($('presCard'))$('presCard').innerHTML='<div style="color:var(--tx3)">加载失败</div>'})
}

    h+='<div><b style="color:var(--tx3)">到期日期：</b>'+fmd(p.end_date?p.end_date.slice(0,10):'')+' <span class="pres-badge '+badgeCls+'">'+badgeTxt+'</span></div>';
    h+='<div><b style="color:var(--tx3)">续期次数：</b>'+p.renewal_count+' 次</div>';
    h+='<div><b style="color:var(--tx3)">状态：</b>'+esc(p.status||'有效')+'</div>';
    if(p.notes)h+='<div><b style="color:var(--tx3)">备注：</b>'+esc(p.notes)+'</div>';
    h+='</div>';
    // 续期历史
    if(p.renewals&&p.renewals.length>0){
      h+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--divider)"><b style="font-size:12px">续期历史：</b>';

function renewPreservation(pid){
  var h='<div class="fgrid"><div class="fg fw"><label>新到期日期 <span class="req">*</span></label><input type="date" id="rn_date"></div>';
  h+='<div class="fg fw"><label>续期裁定书案号</label><input type="text" id="rn_ruling" placeholder="如：（2026）X民保字第XX号"></div>';

function delPreservation(pid){
  confirmm('确认删除','确定删除该保全记录吗？续期历史也将一并删除。',function(){
    apiFetch('/api/preservations/'+pid,{method:'DELETE'}).then(function(){
      toast('已删除','err');
      if(_caseDetailData)loadPreservations(_caseDetailData.id);
      if(currentPage==='preservations')loadPresSummary();
    }).catch(function(){toast('删除失败','err')})

}

/* 首页仪表盘保全预警 */
function loadPresAlertsForDashboard(){
  apiFetch('/api/preservations/alerts').then(function(res){
    var items=res.items||[],urgent=[],warning=[];
    items.forEach(function(p){
      if(p.days_until<0||p.days_until<=7)urgent.push(p);
      else if(p.days_until<=30)warning.push(p);
    });
    var h='';
    if(urgent.length>0){
      urgent.forEach(function(p){
        var label=p.days_until<0?'已于 '+fmd(p.end_date?p.end_date.slice(0,10):'')+' 到期！请尽快申请续期':'还有 '+p.days_until+' 天到期，请立即申请续期';
        h+='<div class="pres-alert-banner urgent"><b>⚠️ 立即处理：</b>'+esc(p.case_number||'')+' — '+esc(p.preservation_type)+'（'+esc(p.target||'').slice(0,20)+'）'+label+' <a href="javascript:void(0)" onclick="navToCase('+p.case_id+')" style="color:var(--warn);font-weight:700">查看 →</a></div>';
      });
    }
    if(warning.length>0){
      warning.forEach(function(p){
        h+='<div class="pres-alert-banner warning"><b>注意：</b>'+esc(p.case_number||'')+' — '+esc(p.preservation_type)+' 还有 '+p.days_until+' 天到期，建议提前准备续期材料 <a href="javascript:void(0)" onclick="navToCase('+p.case_id+')" style="color:var(--accent);font-weight:600">查看 →</a></div>';
      });
    }
    if($('presAlertsBanner'))$('presAlertsBanner').innerHTML=h||'<div style="text-align:center;color:var(--tx3);padding:8px">✅ 暂无待续期的保全</div>';

    // 更新数字卡片
    apiFetch('/api/preservations/stats').then(function(s){
      var urgentCount=s.urgent_count||0;
      var cards=document.querySelectorAll('#statRow .si');
      // 在第4个卡片后插入保全卡片
      if(cards.length>=4&&urgentCount>0){
        var existing=document.getElementById('presStatCard');
        if(!existing){
          var card4=cards[3];
          var div=document.createElement('div');div.id='presStatCard';
          div.className='si';div.setAttribute('onclick',"navTo('preservations')");
          div.innerHTML='<div class="sicon" style="background:#fef0eb">🔒</div><div><div class="snum" style="color:var(--warn)">'+urgentCount+'</div><div class="slbl">待续期保全</div></div>';
          card4.parentNode.insertBefore(div,card4.nextSibling);
        }
      }
    }).catch(function(){});
  }).catch(function(){if($('presAlertsBanner'))$('presAlertsBanner').innerHTML=''})
}

/* 弹窗强制提醒 */
function checkPresAlertsOnLaunch(){
  var today=new Date().toISOString().slice(0,10);
  var lastShown=localStorage.getItem('pres_alert_dismissed');
  if(lastShown===today)return; // 今天已弹过
  apiFetch('/api/preservations/alerts').then(function(res){
    var items=(res.items||[]).filter(function(p){return p.days_until<=7});
    if(items.length===0)return;
    var h='<div style="font-size:13px;line-height:1.8">';
    h+='<p style="color:var(--warn);font-weight:700;font-size:15px;margin-bottom:8px">⚠️ 保全到期紧急提醒</p>';

function loadLocalCases(){
  var params='limit=200';
  if(_lcSearch){params+='&search='+encodeURIComponent(_lcSearch)}
  if(_lcFilter.cat){params+='&case_category='+encodeURIComponent(_lcFilter.cat)}
  if(_lcFilter.province){params+='&province='+encodeURIComponent(_lcFilter.province)}
  if(_lcFilter.city){params+='&city='+encodeURIComponent(_lcFilter.city)}
  if(_lcFilter.district){params+='&district='+encodeURIComponent(_lcFilter.district)}
  if(_lcFilter.judge){params+='&judge='+encodeURIComponent(_lcFilter.judge)}
  if(_lcFilter.result){params+='&judgment_result='+encodeURIComponent(_lcFilter.result)}
  // 后端不支持日期范围筛选，前端过滤
  apiFetch('/api/local-cases?'+params).then(function(res){
    var all=res.items||[];
    // 前端日期范围过滤
    if(_lcFilter.dateFrom)all=all.filter(function(lc){return lc.archived_date&&lc.archived_date.slice(0,10)>=_lcFilter.dateFrom});
    if(_lcFilter.dateTo)all=all.filter(function(lc){return lc.archived_date&&lc.archived_date.slice(0,10)<=_lcFilter.dateTo});
    // 排序
    if(_lcSort==='judge')all.sort(function(a,b){return(a.judge||'').localeCompare(b.judge||'')});
    else if(_lcSort==='case_category')all.sort(function(a,b){return(a.case_category||'').localeCompare(b.case_category||'')});
    else if(_lcSort==='archived_date')all.sort(function(a,b){return(b.archived_date||'').localeCompare(a.archived_date||'')});
    else all.sort(function(a,b){return(b.judgment_date||'').localeCompare(a.judgment_date||'')});

    var tp=Math.ceil(all.length/PSZ)||1;if(PG.localCases>tp)PG.localCases=tp;
    var st=(PG.localCases-1)*PSZ,pg=all.slice(st,st+PSZ);

    var h='';
    if(pg.length===0)h='<div class="cas-empty"><div class="eicon">📚</div><h3>暂无本地判例</h3><p>案件归档时勾选"归档到本地判例库"即可开始积累。</p><button class="btn btn-p" onclick="navTo(\'cases\')">去案件管理</button></div>';
    else{
      h='<div class="lc-grid">';
      pg.forEach(function(lc){
        h+='<div class="lc-card" onclick="navToLocalCase('+lc.id+')">';
        h+='<div class="lcc"><span class="lctag">'+esc(lc.case_category||'其他')+'</span><span class="lcnum">'+esc(lc.case_number||'无案号')+'</span></div>';
        h+='<div class="lcp">👤 '+esc((lc.plaintiff||'')+(lc.defendant?' v. '+lc.defendant:'')||'当事人信息不详')+'</div>';
        h+='<div class="lcm"><span>🏛 '+esc(lc.court_name||'未知法院')+'</span><span>👨‍⚖️ '+esc(lc.judge||'未知法官')+'</span></div>';
        if(lc.key_points)h+='<div class="lck">💡 '+esc(lc.key_points)+'</div>';
        h+='<div class="lcf"><span class="lcres">'+esc(lc.judgment_result||'未知结果')+'</span><span class="lcdate">📅 '+fmd(lc.judgment_date?lc.judgment_date.slice(0,10):'')+' | 归档 '+fmd(lc.archived_date?lc.archived_date.slice(0,10):'')+'</span></div>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+=buildPager('localCases',all.length,'loadLocalCases()');
    if($('lcGrid'))$('lcGrid').innerHTML=h;
  }).catch(function(){
    if($('lcGrid'))$('lcGrid').innerHTML='<div class="empty"><p>加载失败，请确保后端服务已启动</p></div>';
  })
}

function loadJudgeStats(judge,caseCategory){
  if(!judge){if($('lcJudgeStats'))$('lcJudgeStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">无法官信息</div>';return}
  apiFetch('/api/local-cases?judge='+encodeURIComponent(judge)+'&case_category='+encodeURIComponent(caseCategory||'')+'&limit=200').then(function(res){
    var items=res.items||[];
    if(items.length===0){if($('lcJudgeStats'))$('lcJudgeStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">暂无该法官同类案件数据</div>';return}
    // 统计判决结果分布
    var dist={};
    items.forEach(function(lc){
      var r=lc.judgment_result||'其他';
      if(r.indexOf('支持')>-1)r='支持原告诉求';
      else if(r.indexOf('驳回')>-1)r='驳回起诉';
      else if(r.indexOf('调解')>-1)r='调解结案';
      else if(r.indexOf('撤诉')>-1)r='撤诉';
      else r='其他';
      dist[r]=(dist[r]||0)+1;
    });
    var total=items.length;
    var colors={支持原告诉求:'var(--success)',驳回起诉:'var(--warn)',调解结案:'var(--accent)',撤诉:'var(--primary)',其他:'var(--tx3)'};
    var h='<div class="lc-stat-grid">';
    h+='<div class="lc-stat-item"><div class="lcsv">'+total+'</div><div class="lcsl">同类案件总数</div></div>';
    h+='<div class="lc-stat-item"><div class="lcsv">'+(dist['支持原告诉求']||0)+'</div><div class="lcsl">支持原告诉求</div></div>';
    h+='<div class="lc-stat-item"><div class="lcsv">'+(dist['调解结案']||0)+'</div><div class="lcsl">调解结案</div></div>';
    h+='</div>';
    // 柱状图
    Object.keys(dist).forEach(function(k){
      var pct=Math.round(dist[k]/total*100);
      h+='<div class="lc-bar-wrap"><span class="lc-bar-lbl">'+k+'</span><div class="lc-bar-track"><div class="lc-bar-fill" style="width:'+pct+'%;background:'+(colors[k]||'var(--tx3)')+'">'+pct+'% ('+dist[k]+'件)</div></div></div>';
    });
    h+='<div style="font-size:10px;color:var(--tx3);margin-top:8px;text-align:center">*数据基于本地判例库中该法官同类案件统计，仅供参考</div>';
    if($('lcJudgeStats'))$('lcJudgeStats').innerHTML=h;
  }).catch(function(){if($('lcJudgeStats'))$('lcJudgeStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">加载失败</div>'})
}

function loadRegionStats(courtName,caseCategory){
  if(!courtName){if($('lcRegionStats'))$('lcRegionStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">无法院信息</div>';return}
  apiFetch('/api/local-cases?limit=200').then(function(res){
    var all=res.items||[];
    // 同法院同案由
    var same=all.filter(function(lc){return lc.court_name===courtName&&lc.case_category===caseCategory});
    // 同法院全部
    var sameCourt=all.filter(function(lc){return lc.court_name===courtName});
    if(same.length===0&&sameCourt.length===0){if($('lcRegionStats'))$('lcRegionStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">暂无该法院案例数据</div>';return}

    var dist={};
    var target=same.length>0?same:sameCourt;
    target.forEach(function(lc){
      var r=lc.judgment_result||'其他';
      if(r.indexOf('支持')>-1)r='支持原告诉求';
      else if(r.indexOf('驳回')>-1)r='驳回起诉';
      else if(r.indexOf('调解')>-1)r='调解结案';
      else if(r.indexOf('撤诉')>-1)r='撤诉';
      else r='其他';
      dist[r]=(dist[r]||0)+1;
    });
    var total=target.length;
    var colors={支持原告诉求:'var(--success)',驳回起诉:'var(--warn)',调解结案:'var(--accent)',撤诉:'var(--primary)',其他:'var(--tx3)'};
    var h='<div class="lc-stat-grid">';
    h+='<div class="lc-stat-item"><div class="lcsv">'+total+'</div><div class="lcsl">'+(same.length>0?'同案由判例':'同法院判例')+'</div></div>';
    h+='<div class="lc-stat-item"><div class="lcsv">'+sameCourt.length+'</div><div class="lcsl">该法院全部判例</div></div>';
    // 平均审理周期（判决日期 - 归档日期，粗略计算）
    var avgDays='—';
    var withDates=sameCourt.filter(function(lc){return lc.judgment_date&&lc.archived_date});
    if(withDates.length>0){
      var sumDays=0;
      withDates.forEach(function(lc){sumDays+=Math.abs((new Date(lc.archived_date.slice(0,10))-new Date(lc.judgment_date.slice(0,10)))/86400000)});
      avgDays=Math.round(sumDays/withDates.length)+'天';
    }
    h+='<div class="lc-stat-item"><div class="lcsv" style="font-size:16px">'+avgDays+'</div><div class="lcsl">平均归档周期</div></div>';
    h+='</div>';
    Object.keys(dist).forEach(function(k){
      var pct=Math.round(dist[k]/total*100);
      h+='<div class="lc-bar-wrap"><span class="lc-bar-lbl">'+k+'</span><div class="lc-bar-track"><div class="lc-bar-fill" style="width:'+pct+'%;background:'+(colors[k]||'var(--tx3)')+'">'+pct+'% ('+dist[k]+'件)</div></div></div>';
    });
    h+='<div style="font-size:10px;color:var(--tx3);margin-top:8px;text-align:center">*数据基于本地判例库该法院判例统计，仅供参考</div>';
    if($('lcRegionStats'))$('lcRegionStats').innerHTML=h;
  }).catch(function(){if($('lcRegionStats'))$('lcRegionStats').innerHTML='<div style="color:var(--tx3);font-size:12px;text-align:center;padding:16px">加载失败</div>'})
}

/* ---- 判例导入导出 ---- */
function exportLocalCases(){
  apiFetch('/api/local-cases?limit=500').then(function(res){
    var items=res.items||[];
    if(items.length===0){toast('暂无判例数据可导出','err');return}
    // 构建CSV
    var headers=['案由分类','案号','原告','被告','法院名称','承办法官','省份','城市','区/县','判决结果','处理要点','判决日期','归档日期'];
    var rows=[headers.join(',')];
    items.forEach(function(lc){
      var row=[
        '"'+(lc.case_category||'').replace(/"/g,'""')+'"',
        '"'+(lc.case_number||'').replace(/"/g,'""')+'"',
        '"'+(lc.plaintiff||'').replace(/"/g,'""')+'"',
        '"'+(lc.defendant||'').replace(/"/g,'""')+'"',
        '"'+(lc.court_name||'').replace(/"/g,'""')+'"',
        '"'+(lc.judge||'').replace(/"/g,'""')+'"',
        '"'+(lc.province||'').replace(/"/g,'""')+'"',
        '"'+(lc.city||'').replace(/"/g,'""')+'"',
        '"'+(lc.district||'').replace(/"/g,'""')+'"',
        '"'+(lc.judgment_result||'').replace(/"/g,'""')+'"',
        '"'+(lc.key_points||'').replace(/"/g,'""')+'"',
        fmd(lc.judgment_date?lc.judgment_date.slice(0,10):''),
        fmd(lc.archived_date?lc.archived_date.slice(0,10):'')
      ];
      rows.push(row.join(','));
    });
    var csv='﻿'+rows.join('\n'); // BOM for Excel
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='本地判例库_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();URL.revokeObjectURL(a.href);
    toast('已导出 '+items.length+' 条判例 ✅','ok')
  }).catch(function(){toast('导出失败','err')})
}

function importLocalCases(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){
    if(!inp.files||inp.files.length===0)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=JSON.parse(e.target.result);
        if(!Array.isArray(data)){toast('导入格式错误：需要JSON数组','err');return}
        if(data.length===0){toast('文件无数据','err');return}
        var done=0,total=data.length,errors=0;
        toast('正在导入 '+total+' 条判例...','ok');
        data.forEach(function(item){
          apiFetch('/api/local-cases/',{method:'POST',body:JSON.stringify(item)}).then(function(){
            done++;if(done>=total){loadLocalCases();toast('成功导入 '+(total-errors)+'/'+total+' 条判例 ✅','ok')}
          }).catch(function(){errors++;done++;if(done>=total){loadLocalCases();toast('导入完成，成功 '+(total-errors)+'/'+total+' 条','ok')}});
        });
      }catch(ex){toast('JSON解析失败：'+ex.message,'err')}
    };
    reader.readAsText(inp.files[0]);
  };inp.click();
}
